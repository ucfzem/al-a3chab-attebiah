<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعشبة المغربية — موسوعة النباتات الطبية في المغرب</title>
  <link rel="stylesheet" href="./style.css?v=1.3.9">
  <script id="themeBoot">
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('a3chab_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e){}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header>
    <div class="brand"><h1>🌿 المعشبة المغربية</h1><p>موسوعة النباتات الطبية في المغرب</p></div>
    <div class="header-actions"><button id="themeToggle">🌙</button></div>
  </header>
  <div class="disclaimer"><span>⚠️ محتوى تعليمي فقط</span><a href="#/safety">السلامة أولاً ←</a></div>
  <main id="app" aria-live="polite"></main>
  <footer><p>🌿 المعشبة المغربية — 150 مدخلاً موسوعياً</p></footer>
  <script src="./data.js?v=1.3.9"></script>
  <script src="./app.js?v=1.3.9"></script>
</body>
</html>
