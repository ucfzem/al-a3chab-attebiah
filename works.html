له طريق من اتبع رسول الله صلى الله عليه وسلم.\n\nالثانية: التنبيه على الإخلاص، لأن كثيرا لو دعا إلى الحق، فهو يدعو إلى\n\nنفسه.\n\nالثالثة: أن البصيرة من الفرائض.\n\nالرابعة: من دلائل حسن التوحيد: أنه تنزيه الله تعالى عن المسبة.\n\nالخامسة: أن من قبح الشرك كونه مسبة لله.\n\nالسادسة: وهي من أهمها - إبعاد المسلم عن المشركين لئلا يصير منهم، ولو\n\nلم يشرك.\n\nالسابعة: كون التوحيد أول واجب. PageV01P021\n\nالثامنة: أنه يبدأ به قبل كل شيء، حتى الصلاة.\n\nالتاسعة: أن معنى: \"أن يوحدوا الله\" معنى شهادة أن لا إله إلا الله.\n\nالعاشرة: أن الإنسان قد يكون من أهل الكتاب وهو لا يعرفها، أو يعرفها ولا\n\nيعمل بها.\n\nالحادية عشرة: التنبيه على التعليم بالتدريج.\n\nالثانية عشرة: البداءة بالأهم فالأهم.\n\nالثالثة عشرة: مصرف الزكاة.\n\nالرابعة عشرة. كشف العالم الشبهة عن المتعلم.\n\nالخامسة عشرة: النهي عن كرائم الأموال.\n\nالسادسة عشرة: اتقاء دعوة المظلوم.\n\nالسابعة عشرة: الإخبار بأنها لا تحجب.\n\nالثامنة عشرة: من أدلة التوحيد ما جرى على سيد المرسلين وسادات الأولياء\n\nمن المشقة والجوع والوباء.\n\nالتاسعة عشرة: قوله: \"لأعطين الراية ... إلخ\" علم من أعلام النبوة.\n\nالعشرون: تفله في عينيه علم من أعلامها أيضا.\n\nالحادية والعشرون: فضيلة علي رضي الله عنه.\n\nالث",

                "text": "سوله. فيقول: يا رب ما هذه البطاقة مع هذه السجلات، فيقال إنك\n\nلا تظلم، فتوضع السجلات في كفة، والبطاقة في كفة فطاشت السجلات وثقلت\n\nالبطاقة \" رواه الترمذي وحسنه. والنسائي وابن حبان والحاكم. وقال: صحيح على\n\nشرط مسلم، وقال الذهبي في تلخيصه: صحيح 2.\n\nقال ابن القيم - رحمه الله -: \"فالأعمال لا تتفاضل بصورها وعددها، وإنما\n\nتتفاضل بتفاضل ما في القلوب، فتكون ms040 صورة العملين واحدة وبينهما من التفاضل\n\nكما بين السماء والأرض. قال: وتأمل حديث البطاقة التي توضع في كفة ويقابلها\n\nتسعة وتسعون سجلا كل سجل منها مد البصر، فتثقل البطاقة وتطيش السجلات، فلا\n\nيعذب. ومعلوم أن كل موحد له هذه البطاقة وكثير منهم يدخل النار بذنوبه\".\n\nقوله: \"رواه ابن حبان والحاكم\" ابن حبان اسمه محمد بن حبان - بكسر\n\nالمهملة وتشديد الموحدة - ابن أحمد بن حبان بن معاذ، أبو حاتم التميمي\n\nالبستي الحافظ صاحب التصانيف: كالصحيح، والتاريخ، والضعفاء، والثقات وغير\n\nذلك. قال الحاكم: كان من أوعية العلم في الفقه واللغة والحديث والوعظ، ومن\n\nعقلاء الرجال. مات سنة أربع وخمسين وثلاثمائة بمدينة بست - بضم الموحدة\n\nوسكون المهملة -.\n\nرواه ابن حبان والحاكم وصححه.\n\nوللترمذي - وحسنه - عن أنس: سمعت رسول الله صلي الله عليه وسلم يقول: \"\n\nقال الله تعالى: يا ابن آدم لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك\n\nبي شيئا لأتيتك بقرابها مغفرة \" 3.\n\nوأما الحاكم فاسمه محمد بن عبد الله بن محمد النيسابوري أبو عبد الله\n\nالحافظ، ويعرف بابن البيع، ولد سنة إحدى وعشرين وثلاثمائة، وصنف التصانيف،\n\nكالمستدرك وتاريخ نيسابور وغيرهما، ومات سنة خمس وأربعمائة. PageV01P052\n\nقال المصنف - رحمه الله -: \"وللترمذي; وحسنه، عن أنس: سمعت رسول الله صلي\n\nالله عليه وسلم يقول: \" قال الله تعالى: يا ابن آدم; إنك لو أتيتني بقراب\n\nالأرض خطايا ثم لقيتني لا تشرك بي شيئا لأتيتك بقرابها مغفرة1 \" ذكر المصنف\n\n- رحمه الله - الجملة الأخيرة من الحديث، وقد رواه الترمذي بتمامه فقال: عن\n\nأنس قال: سمعت رسول الله صلي الله عليه وسلم يقول: \" قال الله تبارك\n\nوتعالى: يا ابن آدم; إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا\n\nأبالي; يا ابن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك ولا\n\nأبالي يا ابن آدم إنك لو أتيتني \" الحديث.\n\nفيه مسائل:\n\nالأولى: سعة فضل الله.\n\nالثانية: كثرة ثواب التوحيد عند الله.\n\nالثالثة: تكفيره مع ذلك للذنوب.\n\nالرابعة: تفسير الآية التي في سورة الأنعام.\n\nالخامسة: تأمل ms041 الخمس اللواتي في حديث عبادة.\n\nالترمذي: اسمه محمد بن عيسى بن سورة - بفتح المهملة - ابن موسى بن الضحاك\n\nالسلمي أبو عيسى، صاحب الجامع وأحد الحفاظ، كان ضرير البصر، روى عن قتيبة\n\nوهناد والبخاري وخلق. مات سنة تسع وسبعين ومائتين.\n\nوأنس: هو ابن مالك بن النضر الأنصاري الخزرجي، خادم رسول الله صلي الله\n\nعليه وسلم خدمه عشر سنين، وقال له: \" اللهم أكثر ماله وولده، وأدخله الجنة\n\n\" 2 مات سنة اثنتين وقيل: ثلاث وتسعين، وقد جاوز المائة.\n\nوالحديث قد رواه الإمام أحمد من حديث أبي ذر بمعناه، وهذا لفظه: \" ومن\n\nعمل قراب الأرض خطيئة ثم لقيني لا يشرك بي جعلت له مثلها مغفرة 3\" ورواه\n\nمسلم، وأخرجه الطبراني من حديث ابن عباس عن النبي صلي الله عليه وسلم قوله:\n\n\"لو أتيتني بقراب الأرض\" بضم القاف: وقيل بكسرها والضم أشهر وهو\n\nPageV01P053\n\nملؤها أو ما يقارب ملئها.\n\nقوله: \"ثم لقيتني لاتشرك بي شيئا\" شرط ثقيل في الوعد بحصول المغفرة، وهو\n\nالسلامة من الشرك: كثيره وقليله، صغيره وكبيره. ولا يسلم من ذلك إلا من سلم\n\nالله تعالى، وذلك هو القلب السليم كما قال تعالى: {يوم لا ينفع مال ولا\n\nبنون إلا من أتى الله بقلب سليم} 1.\n\nالسادسة: أنك إذا جمعت بينه وبين حديث عتبان وما بعده تبين لك معنى قول:\n\n\" لا إله إلا الله\"، وتبين لك خطأ المغرورين 2.\n\nقال ابن رجب: من جاء مع التوحيد بقراب الأرض خطايا لقيه الله بقرابها\n\nمغفرة - إلى أن قال - فإن كمل توحيد العبد وإخلاصه لله تعالى فيه، وقام\n\nبشروطه بقلبه ولسانه وبجوارحه، أو بقلبه ولسانه عند الموت، أوجب ذلك مغفرة\n\nما قد سلف من الذنوب كلها، ومنعه من دخول النار بالكلية. فمن تحقق بكلمة\n\nالتوحيد قلبه أخرجت منه كل ما سوى الله: محبة وتعظيما، وإجلالا ومهابة\n\nوخشية وتوكلا، وحينئذ تحرق ذنوبه وخطاياه كلها، وإن كانت مثل زبد البحر. اه\n\nملخصا.\n\nقال العلامة ابن القيم - رحمه الله تعالى - في معنى الحديث: \"ويعفى لأهل\n\nالتوحيد المحض الذي لم يشوبوه بالشرك ما لا ms042 يعفى لمن ليس كذلك. فلو لقي\n\nالموحد الذي لم يشرك بالله ش                 "text": "واط. فمررنا بسدرة ; فقلنا: يا رسول الله، اجعل لنا\n\nذات أنواط كما لهم ذات أنواط ; فقال رسول الله صلى الله عليه وسلم: الله\n\nأكبر، إنها السنن. قلتم والذي نفسي بيده كما قالت بنو إسرائيل لموسى: {اجعل\n\nلنا إلها كما لهم آلهة قال إنكم قوم تجهلون} 2 لتركبن سنن من كان قبلكم\"\n\nرواه الترمذي وصححه.\n\nفيه مسائل:\n\nالأولي: تفسير آية النجم. PageV01P032\n\nالثانية: معرفة صورة الأمر الذي طلبوا.\n\nالثالثة: كونهم لم يفعلوا.\n\nالرابعة: كونهم قصدوا التقرب إلى الله بذلك، لظنهم أنه يحبه.\n\nالخامسة: أنهم إذا جهلوا هذا فغيرهم أولى بالجهل.\n\nالسادسة. أن لهم من الحسنات والوعد بالمغفرة ما ليس لغيرهم.\n\nالسابعة. أن النبي صلى الله عليه وسلم لم يعذرهم الأمر، بل رد عليهم\n\nبقوله: \"الله أكبر، إنها السنن. لتتبعن سنن من كان قبلكم\" فغلظ الأمر بهذه\n\nالثلاث.\n\nالثامنة: الأمر الكبير، وهو المقصود: أنه أخبر أن طلبهم كطلب بني إسرائيل\n\nلما قالوا لموسى: {اجعل لنا إلها}\n\nالتاسعة: أن نفى هذا من معنى \" لا إله إلا الله \" مع دقته وخفائه على\n\nأولئك.\n\nالعاشرة: أنه حلف على الفتيا، وهو لا يحلف إلا لمصلحة.\n\nالحادية عشرة: أن الشرك فيه أكبر وأصغر، لأنهم لم يرتدوا بهذا.\n\nالثانية عشرة: قولهم: \"ونحن حدثاء عهد بكفر\" فيه أن غيرهم لا يجهل ذلك.\n\nالثالثة عشرة: التكبير عند التعجب، خلافا لمن كرهه.\n\nالرابعة عشرة: سد الذرائع.\n\nالخامسة عشرة: النهي عن التشبه بأهل الجاهلية.\n\nالسادسة عشرة: الغضب ms11 عند التعليم.\n\nالسابعة عشرة: القاعدة الكلية لقوله: \"إنها السنن\".\n\nالثامنة عشرة: أن هذا علم من أعلام النبوة، لكونه وقع كما أخبر.\n\nالتاسعة عشرة: أن 1 ما ذم الله به اليهود والنصارى في القرآن أنه لنا.\n\nالعشرون: أنه متقرر عندهم أن العبادات مبناها على الأمر، فصار فيه\n\nالتنبيه على مسائل القبر. أما \"من ربك؟ \" فواضح، وأما \" من نبيك؟ \" فمن\n\nإخباره بأنباء الغيب. وأما \" ما دينك؟ \" فمن قولهم: \" اجعل لنا \" إلى آخره.\n\nالحادية والعشرون: أن سنة أهل الكتاب مذمومة كسنة المشركين.\n\nالثانية والعشرون: أن المنتقل من الباطل الذي اعتاده قلبه لا يؤمن أن\n\nيكون في قلبه بقية من تلك العادة، لقولهم: \"ونحن حدثاء عهد بكفر\".\n\nPageV01P034\n\n### | باب (9) ما جاء في الذبح لغير الله\n\nوقول الله تعالى: {قل إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين لا\n\nشريك له وبذلك أمرت وأنا أول المسلمين} 1 وقوله: {فصل لربك وانحر} 2.\n\nعن علي بن أبي طالب رضي الله عنه قال: \"حدثني رسول الله صلى الله عليه\n\nوسلم بأربع كلمات: لعن الله من ذبح لغير الله. لعن الله من لعن والديه. لعن\n\nالله من آوى محدثا ; لعن الله من غير منار الأرض\" 3 رواه مسلم.\n\nوعن طارق بن شهاب: أن رسول الله صلى الله عليه وسلم قال: \"دخل الجنة رجل\n\nفي ذباب، ودخل النار رجل في ذباب. قالوا: وكيف ذلك يا رسول الله؟ قال: مر\n\nرجلان على قوم لهم صنم لا يجوزه أحد حتى يقرب له شيئا، فقالوا لأحدهما:\n\nقرب. قال ليس عندي شيء أقرب. PageV01P035\n\nقالوا له: قرب ولو ذبابا. فقرب ذبابا، فخلوا سبيله. فدخل النار. وقالوا\n\nللآخر: قرب. فقال: ما كنت لأقرب لأحد شيئا دون الله (، فضربوا عنقه؛ فدخل\n\nالجنة\" رواه أحمد.\n\nفيه مسائل:\n\nالأولي: تفسير {إن صلاتي ونسكي} 1.\n\nالثانية: تفسير {فصل لربك وانحر} 2.\n\nالثالثة: البداءة بلعنة من ذبح لغير الله.\n\nالرابعة: لعن من لعن والديه، ومنه أن تلعن والدي الرجل فيلعن والديك.\n\nالخامسة: لعن من آوى محدثا، وهو الرجل يحدث شيئا يجب فيه حق الله، ms12 فيلتجئ\n\nإلى من يجيره من ذلك.\n\nالسادسة: لعن من غير منار الأرض، وهي المراسيم التي تفرق بين ح",

            "fath": {
                "text": "فإن الطائفة الممتنعة تقاتل عليها وإن كانت مقرة بها، وهذا مما لا\n\nأعلم فيه خلافا بين العلماء. قال: وهؤلاء عند المحققين ليسوا بمنزلة\n\nالبغاة، بل هم خارجون عن الإسلام\". انتهى.\n\nقوله: \"وحسابه على الله\" أي الله تبارك وتعالى هو الذي يتولى حساب الذي\n\nيشهد بلسانه بهذه الشهادة، فإن كان صادقا جازاه بجنات النعيم، وإن كان\n\nمنافقا عذبه العذاب الأليم. وأما في الدنيا فالحكم على الظاهر، فمن أتى\n\nبالتوحيد ولم يأت بما ينافيه ظاهرا والتزم شرائع الإسلام وجب الكف عنه.\n\nقلت: وأفاد الحديث أن الإنسان قد يقول: \"لا إله إلا الله\" ولا يكفر بما\n\nيعبدون\n\nومنها: قوله صلي الله عليه وسلم: \" من قال لا إله إلا الله وكفر بما يعبد\n\nمن دون الله، حرم ماله ودمه، وحسابه على الله \" 6 وهذا من أعظم ما يبين\n\nمعنى: \" لا إله إلا الله\" فإنه لم يجعل التلفظ بها عاصما للذم والمال، بل\n\nولا معرفة معناها مع لفظها، بل ولا الإقرار بذلك، بل ولا كونه لا يدعو إلا\n\nالله وحده لا شريك له، بل لا يحرم ماله ودمه حتى يضيف إلى ذلك الكفر بما\n\nيعبد من دون الله. فإن شك أو توقف لم يحرم ماله ودمه.\n\nفيا لها من مسألة ما أعظمها وأجلها! ويا له من بيان ما أوضحه، وحجة ما\n\nأقطعها للمنازع!.\n\nمن دون الله فلم يأت بما يعصم دمه وماله كما دل على ذلك الآيات المحكمات\n\nوالأحاديث.\n\nقوله: \"وشرح هذه الترجمة ما بعدها من الأبواب\"7 قلت: وذلك أن ما بعدها\n\nPageV01P113\n\nمن الأبواب فيه ما يبين التوحيد ويوضح معنى \"لا إله إلا الله\". وفيه\n\nأيضا: بيان أشياء كثيرة من الشرك الأصغر والأكبر ما يوصل إلى ذلك من الغلو\n\nوالبدع، مما تركه من مضمون \"لا إله إلا الله\"، فمن عرف ذلك وتحققه، تبين ms081 له\n\nمعنى \"لا إله إلا الله\" وما دلت عليه من الإخلاص ونفي الشرك، وبضدها تتبين\n\nالأشياء، فبمعرفة الأصغر من الشرك يعرف ما هو أعظم منه من الشرك الأكبر\n\nالمنافي للتوحيد، وأما الأصغر فإنما ينافي كماله، فمن اجتنبه فهو الموحد\n\nحقا، وبمعرفة وسائل الشرك والنهي عنها لتجتنب تعرف الغايات التي نهى عن\n\nالوسائل لأجلها، فإن اجتناب ذلك كله يستلزم التوحيد والإخلاص بل يقتضيه.\n\nوفيه أيضا من أدلة التوحيد إثبات الصفات وتنزيه الرب تعالى عما لا يليق\n\nبجلاله، وكل ما يعرف بالله من صفات كماله وأدلة ربوبيته يدل على أنه هو\n\nالمعبود وحده، وأن العبادة لا تصلح إلا له، وهذا هو التوحيد، ومعنى شهادة\n\nأن لا إله إلا الله\n\n### | باب: \"من الشرك لبس الحلقة والخيط ونحوهما لرفع البلاء أو دفعه\"\n\nوقوله تعالى: {قل أفرأيتم ما تدعون من دون الله إن أرادني الله بضر هل هن\n\nكاشفات ضره أو أرادني برحمة هل هن ممسكات رحمته قل حسبي الله عليه يتوكل\n\nالمتوكلون} 1. PageV01P116\n\nعن عمران بن حصين رضي الله عنه \" أن النبي صلي الله عليه وسلم رأى رجلا\n\nفي يده حلقة من صفر، فقال: ما هذا؟ قال من الواهنة. فقال: انزعها فإنها لا\n\nتزيدك إلا وهنا؛ فإنك لو مت وهي عليك ما أفلحت أبدا \" 1 رواه أحمد بسند لا\n\nبأس به.\n\nوإنما كانوا يدعونها على معنى أنها وسائط وشفعاء عند الله، لا على أنهم\n\nيكشفون الضر، ويجيبون دعاء المضطر، فهم يعلمون أن ذلك لله وحده. كما قال\n\nتعالى: {إذا مسكم الضر فإليه تجأرون ثم إذا كشف الضر عنكم إذا فريق منكم\n\nبربهم يشركون} 2.\n\nقلت: فهذه الآية وأمثالها تبطل تعلق القلب بغير الله في جلب نفع أو دفع\n\nضر، وأن ذلك شرك بالله. وفي الآية بيان أن الله تعالى وسم أهل الشرك بدعوة\n\nغير الله والرغبة إليه من دون الله. والتوحيد ضد ذلك. وهو أن لا يدعو إلا\n\nالله، ولا يرغب إلا إليه، ولا يتوكل إلا عليه، وكذا جميع أنواع العبادة لا\n\nيصلح منها شيء لغير ms082 الله. كما دل على ذلك الكتاب والسنة وإجماع سلف الأمة\n\nوأئمتها كما تقدم. PageV01P117\n\nقال: \"وعن عمران بن حصين \"أن النبي صلي الله عليه وسلم رأى رجلا في يده\n\nحلقة من صفر فقال ما هذه؟ قال: من الواهنة. قال: انزعها فإنها لا تزيدك إلا\n\nوهنا; فإنك لو مت وهي عليك ما أفلحت أبدا \" رواه أحمد بسند لا بأس به\".\n\nقال الإمام أحمد: حدثنا خلف بن الوليد حدثنا المبارك عن الحسن قال:\n\nأخبرني عمران بن حصين \"أن النبي صلي الله عليه وسلم أبصر على عضد رجل حلقة\n\n– قال: أراها من صفر - فقال: ويحك ما هذه؟ قال: من الواهنة. قال: أما إنها\n\nلا تزيدك إلا وهنا. انبذها عنك؛ فإنك لو مت وهي عليك ما أفلحت أبدا \" 1\n\nرواه ابن حبان في صحيحه فقال: \" فإنك إن مت وكلت إليها \". والحاكم، وقال:\n\nصحيح الإسناد. وأقره الذهبي.\n\nوقال الحاكم: أكثر مشايخنا على أن الحسن سمع من عمران. وقوله في الإسناد:\n\n\"أخبرني عمران\" يدل على ذلك2.\n\nقوله: \"عن عمران بن حصين\" أي ابن عبيد بن خلف الخزاعي، أبو نجيد - بنون\n\nوجيم – مصغر، صحابي ابن صحابي، أسلم عام خيبر، ومات سنة اثنتين وخمسين\n\nبالبصرة.\n\nقوله: \"رأى رجلا\" في رواية الحاكم: \" دخلت على رسول الله صلي ا",

            "kitab": {
                "text": "يد المرسلين، وخلفه سادات الأولياء يؤمنون في الصلاة.\n\nالرابعة: أن المدعو عليهم كفار.\n\nالخامسة: أنهم فعلوا أشياء ما فعلها غالب الكفار، منها: شجهم نبيهم،\n\nوحرصهم على قتله. ومنها: التمثيل بالقتلى، مع أنهم بنو عمهم.\n\nالسادسة: أنزل الله عليه في ذلك: {ليس لك من الأمر شيء} 2.\n\nالسابعة: قوله: {أو يتوب عليهم أو يعذبهم} 3، فتاب عليهم فآمنوا.\n\nالثامنة: القنوت في النوازل.\n\nالتاسعة: تسمية المدعو عليهم في الصلاة بأسمائهم وأسماء آبائهم.\n\nPageV01P046\n\nالعاشرة: لعن المعين في القنوت.\n\nالحادية عشرة: قصته صلى الله عليه وسلم لما أنزل عليه: {وأنذر عشيرتك\n\nالأقربين} 1.\n\nالثانية عشرة: جده صلى الله عليه وسلم 2، بحيث فعل ما نسب بسببه إلى\n\nالجنون، وكذلك لو يفعله مسلم الآن.\n\nالثالثة عشرة: قوله 3 للأبعد والأقرب: ms16 \"لا أغني عنك من الله شيئا\" حتى\n\nقال: \"يا فاطمة بنت محمد، لا أغني عنك من الله شيئا\" 4. فإذا صرح وهو سيد\n\nالمرسلين بأنه لا يغني شيئا عن سيدة نساء العالمين، وآمن الإنسان أنه صلى\n\nالله عليه وسلم لا يقول إلا الحق، ثم نظر فيما وقع في قلوب خواص الناس\n\nاليوم، تبين له التوحيد وغربة الدين. PageV01P047\n\n### | باب (15) قول الله تعالى: {حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم\n\nقالوا الحق وهو العلي الكبير} 1.\n\nفي الصحيح عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال:\n\n\"إذا قضى الله الأمر في السماء ضربت الملائكة بأجنحتها خضعانا لقوله، كأنه\n\nسلسلة على صفوان ينفذهم ذلك {حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم\n\nقالوا الحق وهو العلي الكبير} 2 فيسمعها مسترق السمع - ومسترق السمع هكذا\n\nبعضه فوق بعض - وصفه سفيان بكفه فحرفها وبدد بين أصابعه - فيسمع الكلمة\n\nفيلقيها إلى من تحته، ثم يلقيها الآخر إلى من تحته، حتى يلقيها على لسان\n\nالساحر أو الكاهن. فربما أدركه الشهاب قبل أن يلقيها، وربما ألقاها قبل أن\n\nيدركه، فيكذب معها مائة كذبة. فيقال: أليس قد قال لنا يوم كذا وكذا كذا\n\nوكذا؟ فيصدق بتلك الكلمة التي سمعت من السماء\".\n\nوعن النواس بن سمعان رضي الله عنه قال: قال رسول الله صلى الله عليه\n\nوسلم: \"إذا أراد الله تعالى أن يوحي بالأمر تكلم بالوحي أخذت السموات منه\n\nرجفة - أو قال رعدة - شديدة خوفا من الله (؛ فإذا سمع ذلك أهل السموات\n\nصعقوا، وخروا لله سجدا. فيكون PageV01P048\n\nأول من يرفع رأسه جبريل، فيكلمه الله من وحيه بما أراد. ثم يمر جبريل على\n\nالملائكة، كلما مر بسماء سأله ملائكتها: ماذا قال ربنا يا جبريل؟ فيقول\n\nجبريل قال الحق وهو العلي الكبير فيقولون كلهم مثل ما قال جبريل فينتهي\n\nجبريل بالوحي إلى حيث أمره الله)\n\nفيه مسائل:\n\nالأولي: تفسير الآية.\n\nالثانية: ما فيها من الحجة على إبطال الشرك، خصوصا ما تعلق على الصالحين،\n\nوهي الآية التي ms17 قيل: إنها تقطع عروق شجرة الشرك من القلب.\n\nالثالثة. تفسير قوله: {قالوا الحق وهو العلي الكبير} 1.\n\nالرابعة: سبب سؤالهم عن ذلك.\n\nالخامسة: أن جبرائيل يجيبهم بعد ذلك بقوله: \" قال كذا وكذا \".\n\nالسادسة: ذكر أن أول من يرفع رأسه جبرائيل.\n\nالسابعة: أنه يقول لأهل السموات كلهم، لأنهم يسألونه.\n\nالثامنة: أن الغشي يعم أهل السموات كلهم.\n\nالتاسعة: ارتجاف السموات بكلام الله.\n\nالعاشرة: أن جبرائيل هو الذي ينتهي بالوحي إلى حيث أمره الله.\n\nالحادية عشرة: ذكر استراق الشياطين. PageV01P049\n\nالثانية عشرة: صفة ركوب بعضهم بعضا.\n\nالثالثة عشرة: إرسال الشهاب 1.\n\nالرابعة عشرة: أنه تارة يدركه الشهاب قبل أن يلقيها، وتارة يلقيها في أذن\n\nوليه من الإنس قبل أن يدركه.\n\nالخامسة عشرة: كون الكاهن",

                "text": "الأمر\n\nوالمخاطبة للنبي صلي الله عليه وسلم. إذا كانت هكذا فأحرى أن يحذر من ذلك\n\nغيره. والخطاب خرج مخرج الخصوص وهو عام للأمة.\n\nقال أبو جعفر ابن جرير في هذه الآية: يقول - تعالى ذكره -: ولا تدع يا\n\nمحمد من دون معبودك وخالقك شيئا لا ينفعك في الدنيا ولا في الآخرة، ولا\n\nيضرك في دين ولا دنيا، يعني بذلك الآلهة والأصنام، يقول: لا تعبدها راجيا\n\nنفعها أو خائفا ضرها فإنها لا تنفع ولا تضر. فإن فعلت ذلك فدعوتها من دون\n\nالله {فإنك إذا من الظالمين} 3 يقول من المشركين بالله الظالم لنفسه4.\n\nقلت: وهذه الآية لها نظائر كقوله: {فلا تدع مع ms121 الله إلها آخر فتكون من\n\nالمعذبين} 5. وقوله: {ولا تدع مع الله إلها آخر لا إله إلا هو} 6. ففي هذه\n\nالآيات بيان أن كل مدعو يكون إلها، والإلهية حق لله لا يصلح منها شيء\n\nلغيره. ولهذا قال: {لا إله إلا هو} 7 كما قال تعالى: {ذلك بأن الله هو الحق\n\nوأن ما يدعون من دونه هو الباطل وأن الله هو العلي الكبير} 8 وهذا هو\n\nالتوحيد الذي بعث الله به رسله، وأنزل به كتبه; كما قال تعالى: {وما أمروا\n\nإلا ليعبدوا الله مخلصين له الدين} 9. والدين: كل ما يدان الله به من\n\nالعبادات الظاهرة والباطنة. وفسره ابن جرير في تفسيره بالدعاء، وهو فرد من\n\nأفراد العبادة، على عادة السلف في التفسير، يفسرون الآية ببعض أفراد\n\nمعناها، فمن صرف منها شيئا لقبر أو صنم أو وثن أو غير ذلك، فقد اتخذه\n\nمعبودا وجعله شريكا لله في PageV01P171\n\nالإلهية التي لا يستحقها إلا هو، كما قال تعالى: {ومن يدع مع الله إلها\n\nآخر لا برهان له به فإنما حسابه عند ربه إنه لا يفلح الكافرون} 1. فتبين\n\nبهذه الآية ونحوها أن دعوة غير الله كفر وشرك وضلال.\n\nوقوله: {وإن يمسسك الله بضر فلا كاشف له إلا هو وإن يردك بخير فلا راد\n\nلفضله} 23 فإنه المنفرد بالملك والقهر، والعطاء والمنع، والضر والنفع، دون\n\nكل ما سواه. فيلزم من ذلك أن يكون هو المدعو وحده، المعبود وحده; فإن\n\nالعبادة لا تصلح إلا لمالك الضر والنفع. ولا يملك ذلك ولا شيئا منه غيره\n\nتعالى، فهو المستحق للعبادة وحده، دون من لا يضر ولا ينفع. وقوله تعالى:\n\n{قل أفرأيتم ما تدعون من دون الله إن أرادني الله بضر هل هن كاشفات ضره أو\n\nأرادني برحمة هل هن ممسكات رحمته قل حسبي الله عليه يتوكل المتوكلون} 5.\n\nوقال {ما يفتح الله للناس من رحمة فلا ممسك لها وما يمسك فلا مرسل له من\n\nبعده وهو العزيز الحكيم} 6. فهذا ما أخبر به الله تعالى في كتابه من تفرده\n\nبالإلهية والربوبية، ونصب ms122 الأدلة على ذلك. فاعتقد عباد القبور والمشاهد\n\nنقيض ما أخبر به الله تعالى، واتخذوهم PageV01P172\n\nشركاء لله في استجلاب المنافع ودفع المكاره، بسؤالهم والالتجاء إليهم\n\nبالرغبة والرهبة والتضرع، وغير ذلك من العبادات التي لا يستحقها إلا الله\n\nتعالى، واتخذوهم شركاء لله في ربوبيته وإلهيته. وهذا فوق شرك كفار العرب\n\nالقائلين: {ما نعبدهم إلا ليقربونا إلى الله زلفى} 1، {هؤلاء شفعاؤنا عند\n\nالله} 2 فإن أولئك يدعونهم ليشفعوا لهم ويقربوهم إلى الله، وكانوا يقولون\n\nفي تلبيتهم: لبيك، لا شريك لك إلا شريكا هو لك تملكه وما ملك.\n\nوأما هؤلاء المشركون فاعتقدوا في أهل القبور والمشاهد ما هو أعصم من ذلك،\n\nفجعلوا لهم نصيبا من التصرف والتدبير، وجعلوهم معاذا لهم وملاذا في الرغبات\n\nوالرهبات {سبحان الله عما يشركون} 3.\n\nوقوله: {وهو الغفور الرحيم} 4 أي لمن تاب إليه.\n\nقال: \"وقوله تعالى: {فابتغوا عند الله الرزق واعبدوه واشكروا له إليه\n\nترجعون} 5\".\n\nوقوله: {ومن أضل ممن يدعو من دون الله من لا يستجيب له إلى يوم القيامة\n\nوهم عن دعائهم غافلون} 6.\n\nيأمر تعالى عباده بابتغاء الرزق منه وحده دون ما سواه ممن لا يملك لهم\n\nرزقا من السماوات والأرض شيئا، فتقديم الظرف يفيد الاختصاص. وقوله:\n\n{واعبدوه} من عطف العام على الخاص؛ فإن ابتغاء الرزق عنده من العبادة التي\n\nأمر الله بها.\n\nقال العماد ابن كثير - رحمه الله تعالى -: {فابتغوا} أي فاطلبوا {عند\n\nالله الرزق} أي لا عند غيره. لأنه المالك له، وغيره لا يملك شيئا من ذلك:\n\n{واعبدوه} أي أخلصوا له العبادة وحده لا شريك له {واشكروا له} أي على ما\n\nأنعم عليكم {إليه ترجعون} أي يوم القيامة فيجازي كل عامل بعمله.\n\nقال: \"وقوله: {ومن أضل ممن يدعو من دون الله من لا يستجيب له إلى يوم\n\nالقيامة وهم عن دعائهم غافلون وإذا حشر الناس كانوا لهم أعداء وكانوا\n\nبعبادتهم كافرين} 7\".\n\nنفى سبحانه أن يكون أحد أضل ممن يدعو غيره. وأخبر أنه لا يستجيب\n\nPageV01P173\n\nله ما طلب منه إلى يوم القيامة. والآية تعم كل ما يدعى من ms123 دون الله، كما\n\nقال تعالى: {قل ادعوا الذين زعمتم من دونه فلا يملكون كشف الضر عنكم ولا\n\nتحويلا} 1. وفي هذه الآية أخبر أنه لا يستجيب وأنه غافل عن داعيه {وإذا حشر\n\nالناس كانوا لهم أعداء وكانوا بعبادتهم كاف",

                "text": ".\n\nالخامسة عشرة: التصريح بأنهم لم يريدوا إلا الشفاعة.\n\nالسادسة عشرة: ظنهم أن العلماء الذين صوروا الصور أرادوا ذلك.\n\nPageV01P058\n\nالسابعة عشرة: البيان العظيم في قوله: \"لا تطروني كما أطرت النصارى ابن\n\nمريم\" 1. فصلوات الله ms21 وسلامه على من بلغ البلاغ المبين.\n\nالثامنة عشرة: نصيحته إيانا بهلاك المتنطعين.\n\nالتاسعة عشرة: التصريح بأنها لم تعبد حتى نسي العلم، ففيها بيان معرفة\n\nقدر وجوده، ومضرة فقده.\n\nالعشرون: أن سبب فقد العلم موت العلماء. PageV01P059\n\n### | باب (19) ما جاء من التغليظ فيمن عبد الله عند قبر رجل صالح، فكيف إذا عبده؟\n\nفي الصحيح عن عائشة: \"أن أم سلمة ذكرت لرسول الله صلى الله عليه وسلم\n\nكنيسة رأتها بأرض الحبشة وما فيها من الصور، فقال: أولئك إذا مات فيهم\n\nالرجل الصالح أو العبد الصالح بنوا على قبره مسجدا، وصوروا فيه تلك الصور؛\n\nأولئك شرار الخلق عند الله\" 1. فهؤلاء جمعوا بين فتنتين: فتنة القبور،\n\nوفتنة التماثيل.\n\nولهما، عنها، قالت: \"لما نزل برسول الله صلى الله عليه وسلم، طفق يطرح\n\nخميصة له على وجهه، فإذا اغتم بها كشفها فقال -: وهو كذلك- لعنة الله على\n\nاليهود والنصارى، اتخذوا قبور أنبيائهم مساجد. يحذر ما صنعوا، ولولا ذلك\n\nأبرز قبره، غير أنه خشي أن يتخذ مسجدا\" 2 أخرجاه.\n\nولمسلم عن جندب بن عبد الله قال: سمعت النبي صلى الله عليه وسلم\n\nPageV01P060\n\nقبل أن يموت بخمس، وهو يقول: \"إني أبرأ إلى الله أن يكون لي منكم خليل،\n\nفإن الله قد اتخذني خليلا كما اتخذ إبراهيم خليلا. ولو كنت متخذا من أمتي\n\nخليلا لاتخذت أبا بكر خليلا. ألا وإن من كان قبلكم كانوا يتخذون قبور\n\nأنبيائهم مساجد؛ ألا فلا تتخذوا القبور مساجد، فإني أنهاكم عن ذلك\" 1. فقد\n\nنهى عنه في آخر حياته. ثم إنه لعن - وهو في السياق - من فعله. والصلاة\n\nعندها من ذلك وإن لم يبن مسجد، وهو معنى قولها: \"خشي أن يتخذ مسجدا\" 2، فإن\n\nالصحابة لم يكونوا ليبنوا حول قبره مسجدا، وكل موضع قصدت الصلاة فيه فقد\n\nاتخذ مسجدا، بل كل موضع يصلى فيه يسمى مسجدا، كما قال صلى الله عليه وسلم:\n\n\"جعلت لي الأرض مسجدا وطهورا\" 3.\n\nولأحمد بسند جيد عن ابن مسعود رضي الله عنه مرفوعا: \"إن من شرار الناس من\n\nتدركهم الساعة وهم أحياء، والذين يتخذون ms22 القبور مساجد\" 4 ورواه أبو حاتم في\n\nصحيحه.\n\nفيه مسائل:\n\nالأولى: ما ذكر الرسول فيمن بنى مسجدا يعبد الله فيه عند قبر رجل صالح،\n\nولو صحت نية الفاعل.\n\nالثانية: النهي عن التماثيل، وغلظ الأمر في ذلك 5. PageV01P061\n\nالثالثة: العبرة في مبالغته صلى الله عليه وسلم في ذلك. كيف بين لهم هذا\n\nأولا، ثم قبل موته بخمس، قال ما قال، ثم لما كان في السياق لم يكتف بما\n\nتقدم.\n\nالرابعة: نهيه عن فعله عند قبره قبل أن يوجد القبر.\n\nالخامسة: أنه من سنن اليهود والنصارى في قبور أنبيائهم.\n\nالسادسة: لعنه إياهم على ذلك.\n\nالسابعة: أن مراده تحذيره إيانا عن قبره 1.\n\nالثامنة: العلة في عدم إبراز قبره.\n\nالتاسعة: في معنى اتخاذها مسجدا.\n\nالعاشرة: أنه قرن بين من اتخذها 2 وبين من تقوم عليه الساعة، فذكر\n\nالذريعة إلى الشرك قبل وقوعه مع خاتمته.\n\nالحادية عشرة: ذكره في خطبته قبل موته بخمس: الرد على الطائفتين اللتين\n\nهما شرار أهل البدع، بل أخرجهم بعض أهل العلم من الثنتين والسبعين فرقة،\n\nوهم الرافضة والجهمية. وبسبب الرافضة حدث الشرك وعبادة القبور ; وهم أول من\n\nبنى عليها المساجد. PageV01P062\n\nالثانية عشرة: ما بلي به صلى الله عليه وسلم من شدة النزع.\n\nالثالثة عشرة: ما أكرم به من الخلة.\n\nالرابعة عشرة: التصريح بأنها أعلى من المحبة.\n\nالخامسة عشرة: التصريح بأ",

            "fath": {
                "text": "ن بعده تبين له غربة الإسلام، ورأى من\n\nقدرة الله وتقليبه للقلوب العجب.\n\nالثانية: معرفة أول شرك حدث في الأرض أنه بشبهة الصالحين.\n\nالثالثة: أول شيء غير به دين الأنبياء، وما سبب ذلك مع معرفة أن الله\n\nأرسلهم.\n\nالرابعة: قبول البدع مع كون الشرائع والفطر تردها.\n\nالخامسة: أن سبب ms161 ذلك كله مزج الحق بالباطل، فالأول: محبة الصالحين.\n\nوالثاني: فعل أناس من أهل العلم شيئا أرادوا به خيرا، فظن من بعدهم أنهم\n\nأرادوا به غيره.\n\nالسادسة: تفسير الآية التي في سورة نوح. PageV01P227\n\nالكلام الداخلين فيما لا يعنيهم، الخائضين فيما لا تبلغه عقولهم\".\n\nومن التنطع: الامتناع من المباح مطلقا، كالذي يمتنع من أكل اللحم والخبز،\n\nالسابعة: جبلة الآدمي1 في كون الحق ينقص في قلبه والباطل يزيد.\n\nالثامنة: فيه شاهد لما نقل عن السلف أن البدع سبب الكفر.\n\nالتاسعة: معرفة الشيطان بما تئول إليه البدعة، ولو حسن قصد الفاعل.\n\nالعاشرة: معرفة القاعدة الكلية، وهي النهي عن الغلو ومعرفة ما تئول إليه.\n\nالحادية عشرة: مضرة العكوف على القبر لأجل عمل صالح.\n\nالثانية عشرة: معرفة النهي عن التماثيل والحكمة في إزالتها.\n\nالثالثة عشرة: معرفة شأن هذه القصة وشدة الحاجة إليها مع الغفلة عنها.\n\nالرابعة عشرة: وهي أعجب، وأعجب قراءتهم إياها في كتب التفسير والحديث\n\nومعرفتهم بمعنى الكلام، وكون الله حال بينهم وبين قلوبهم، حتى اعتقدوا أن\n\nفعل قوم نوح أفضل العبادات، فاعتقدوا أن ما نهى الله ورسوله عنه فهو الكفر\n\nالمبيح للدم والمال.\n\nالخامسة عشرة: التصريح بأنهم لم يريدوا إلا الشفاعة.\n\nومن لبس الكتان والقطن، ولا يلبس إلا الصوف، ويمتنع من نكاح النساء، ويظن\n\nأن هذا من الزهد المستحب. قال الشيخ تقي الدين: \" فهذا جاهل ضال\". انتهى.\n\nوقال ابن القيم -رحمه الله-: قال الغزالي: \" والمتنطعون في البحث\n\nوالاستقصاء\".\n\nوقال أبو السعادات: \" هم المتعمقون الغالون في الكلام، المتكلمون بأقصى\n\nحلوقهم. مأخوذ من النطع، وهو الغار الأعلى من الفم، ثم استعمل في كل متعمق\n\nقولا وفعلا\". PageV01P228\n\nوقال النووي: \" فيه كراهة التقعر في الكلام بالتشدق وتكلف الفصاحة،\n\nواستعمال وحشي اللغة ودقائق الإعراب في مخاطبة العوام ونحوهم\".\n\nقوله: \"قالها ثلاثا\" أي قال هذه الكلمة ثلاث مرات، مبالغة في التعليم\n\nوالإبلاغ، فقد بلغ البلاغ المبين. صلوات الله وسلامه عليه وعلى آله وصحبه\n\nأجمعين.\n\nالسادسة عشرة: ظنهم أن العلماء الذين صوروا الصور أرادوا ذلك.\n\nالسابعة عشرة: البيان العظيم في قوله: ms162 \" لا تطروني كما أطرت النصارى ابن\n\nمريم \" 1 فصلوات الله وسلامه على من بلغ البلاغ المبين.\n\nالثامنة عشرة: نصيحته إيانا بهلاك المتنطعين.\n\nالتاسعة عشرة: التصريح بأنها لم تعبد حتى نسي العلم، ففيها بيان معرفة\n\nقدر وجوده ومضرة فقده.\n\nالعشرون: أن سبب فقد العلم موت العلماء. PageV01P229\n\n### | باب: \" ما جاء من التغليظ فيمن عبد الله عند قبر رجل صالح فكيف إذا عبده؟ \"\n\nفي الصحيح \" عن عائشة أن أم سلمة ذكرت لرسول الله صلي الله عليه وسلم\n\nكنيسة رأتها بأرض PageV01P229\n\nعبادته، ووسائل الشرك محرمة; لأنها تؤدي إلى الشرك الأكبر وهو أعظم\n\nالذنوب.\n\nقوله: \"في الصحيح: \"عن عائشة -رضي الله عنها- أن أم سلمة ذكرت لرسول الله\n\nصلي الله عليه وسلم كنيسة رأتها بأرض الحبشة 1 وما فيها من الصور. فقال: \"\n\nأولئك إذا مات فيهم الرجل الصالح -أو العبد الصالح-، بنوا على قبره مسجدا،\n\nوصوروا فيه تلك الصور، أولئك شرار الخلق عند الله \" 2. فهؤلاء جمعوا بين\n\nالفتنتين: فتنة القبور وفتنة التماثيل\".\n\nقوله: \"في الصحيح\" أي الصحيحين.\n\nقوله: \"أن أم سلمة\" هي هند بنت أبي أمية بن المغيرة بن عبد الله بن عمرو\n\nبن مخزوم القرشية المخزومية، تزوجها رسول الله صلي الله عليه وسلم بعد أبي\n\nسلمة سنة أربع. وقيل: الحبشة وما فيها من الصور، فقال: أولئك إذا مات فيهم\n\nالرجل الصالح -أو العبد الصالح-، بنوا على قبره مسجدا وصوروا فيه تلك\n\nالصور، أولئك شرار الخلق عند الله \"3.\n\nثلاث; وكانت قد هاجرت مع أبي سلمة إلى الحبشة4 ماتت سنة اثنتين وستين.\n\nقوله: \"ذكرت لرسول الله\" وفي الصحيحين: \" أن أم حبيبة وأم سلمة ذكرتا ذلك\n\nلرسول الله صلي الله عليه وسلم\". و\"الكنسية\" بفتح الكاف وكسر النون: معبد\n\nالنصارى.\n\nقوله: \"أولئك\" بكسر الكاف، خطاب للمرأة.\n\nقوله: \"إذا مات فيهم الرجل الصالح أو العبد الصالح\" هذا- والله أعلم- شك\n\nمن بعض رواة الحديث: هل قال النبي صلي الله عليه وسلم هذا أو هذا؟ ففيه\n\nالتحري في الرواية. وجواز الرواية بالمعنى. PageV01P230\n\nقوله: \"وصوروا فيه تلك الصور\" الإشارة إلى ما ذكرت أم سلمة ms163 وأم حبيبة من\n\nالتصاوير التي في الكنيسة.\n\nقوله: \"أولئك شرار الخلق عند الله\" وهذا يقتضي تحريم بناء المساجد على\n\nالقبور، وقد لعن صلي الله عليه وسلم من فعل ذلك كما سيأتي",

            "kitab": {
                "text": "\".\n\nوصح \"عن حفصة رضي الله عنها أنها أمرت بقتل جارية لها سحرتها فقتلت\"\n\nوكذلك صح عن جندب قال أحمد: عن ثلاثة من أصحاب النبي صلى الله عليه وسلم.\n\nفيه مسائل:\n\nالأولى: تفسير آية البقرة.\n\nالثانية: تفسير آية النساء.\n\nالثالثة: تفسير الجبت والطاغوت، والفرق بينهما.\n\nالرابعة: أن الطاغوت قد يكون من الجن، وقد يكون من الإنس.\n\nالخامسة: معرفة السبع الموبقات المخصوصات بالنهي.\n\nالسادسة: أن الساحر يكفر.\n\nالسابعة: أنه يقتل ولا يستتاب.\n\nالثامنة: وجود هذا في المسلمين على عهد عمر، فكيف بعده؟\n\n### | باب (24) بيان شيء من أنواع السحر\n\nقال أحمد: حدثنا محمد بن جعفر، حدثنا عوف، عن حيان بن العلاء، حدثنا قطن\n\nبن قبيصة عن أبيه أنه سمع النبي صلى الله عليه وسلم قال: \"إن العيافة\n\nوالطرق والطيرة من الجبت\" 1.\n\nقال عوف: العيافة: زجر الطير. والطرق: الخط يخط بالأرض.\n\nوالجبت: قال الحسن: \"رنة الشيطان\" إسناده جيد. ولأبي داود والنسائي وابن\n\nحبان في صحيحه المسند منه.\n\nوعن ابن عباس رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: \"من\n\nاقتبس شعبة من النجوم فقد اقتبس شعبة من السحر، زاد ما زاد\" 2. رواه أبو\n\nداود، وإسناده صحيح.\n\nوللنسائي من حديث أبي هريرة رضي الله عنه: \"من عقد عقدة ثم نفث فيها فقد\n\nسحر، ومن سحر فقد أشرك. ومن تعلق شيئا وكل إليه\" 3. PageV01P074\n\nوعن ابن مسعود أن رسول الله صلى الله عليه وسلم قال: \"ألا هل أنبئكم ما\n\nالعضة؟ هي النميمة القالة بين الناس\" 1 رواه مسلم. ولهما عن ابن عمر رضي\n\nالله عنهما: أن رسول الله صلى الله عليه وسلم قال: \"إن من البيان لسحرا\" 2.\n\nفيه مسائل:\n\nالأولي: أن العيافة والطرق والطيرة من الجبت.\n\nالثانية: تفسير العيافة والطرق.\n\nالثالثة: أن علم ms27 النجوم من نوع السحر.\n\nالرابعة: العقد مع النفث من ذلك.\n\nالخامسة: أن النميمة من ذلك.\n\nالسادسة: أن من ذلك بعض الفصاحة. PageV01P075\n\n### | باب (25) ما جاء في الكهان ونحوهم\n\nروى مسلم في صحيحه عن بعض أزواج النبي صلى الله عليه وسلم عن النبي صلى\n\nالله عليه وسلم قال: \"من أتى عرافا فسأله عن شيء فصدقه لم تقبل له صلاة\n\nأربعين يوما\" 1.\n\nوعن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"من أتى\n\nكاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم\" 2.\n\nرواه أبو داود. وللأربعة والحاكم وقال: صحيح على شرطهما عن أبي هريرة 3\n\n\":من أتى عرافا أو كاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى\n\nالله عليه وسلم\" 4. ولأبي يعلى بسند جيد عن ابن مسعود مثله موقوفا.\n\nPageV01P076\n\nوعن عمران بن حصين رضي الله عنه مرفوعا: \"ليس منا من تطير أو تطير له أو\n\nتكهن أو تكهن له، أو سحر أو سحر له؛ ومن أتى كاهنا فصدقه بما يقول فقد كفر\n\nبما أنزل على محمد صلى الله عليه وسلم\" رواه البزار بإسناد جيد. ورواه\n\nالطبراني في الأوسط بإسناد حسن من حديث ابن عباس دون قوله: \"ومن أتى\" إلى\n\nآخره.\n\nقال البغوي: العراف: الذي يدعي معرفة الأمور بمقدمات يستدل بها على\n\nالمسروق ومكان الضالة، ونحو ذلك. وقيل: هو الكاهن. والكاهن: هو الذي يخبر\n\nعن المغيبات في المستقبل. وقيل: الذي يخبر عما في الضمير.\n\nوقال أبو العباس بن تيمية: العراف: اسم الكاهن والمنجم والرمال ونحوهم،\n\nممن يتكلم في معرفة الأمور بهذه الطرق. وقال ابن عباس - في قوم يكتبون أبا\n\nجاد وينظرون في النجوم: \"ما أرى من فعل ذلك له عند الله من خلاق\".\n\nفيه مسائل:\n\nالأولى: لا يجتمع تصديق الكاهن مع الإيمان بالقرآن.\n\nالثانية: التصريح بأنه كفر.\n\nالثالثة: كر من تكهن له.\n\nالرابعة: كر من تطير له.\n\nالخامسة: كر من سحر ل",

            "fath": {
                "text": "ها.\n\nقال النووي: يجوز أن تكون الطائفة جماعة متعددة من أنواع المؤمنين ما بين\n\nشجاع وبصير بالحرب، وفقيه ومحدث ومفسر، وقائم بالأمر بالمعروف والنهي عن\n\nالمنكر، وزاهد وعابد، ولا يلزم أن يكونوا مجتمعين في بلد واحد، بل يجوز\n\nاجتماعهم في قطر واحد، وافتراقهم في أقطار الأرض، ويجوز أن يجتمعوا في\n\nالبلد الواحد، وأن يكونوا في بعض دون بعض منه. ويجوز إخلاء الأرض من بعضهم\n\nأولا فأولا إلى أن لا يبقى إلا فرقة واحدة ببلد واحد، فإذا ms201 انقرضوا جاء أمر\n\nالله. اه ملخصا مع زيادة فيه. قاله الحافظ. PageV01P276\n\nقال القرطبي: \" وفيه دليل على أن الإجماع حجة؛ لأن الأمة إذا اجتمعت فقد\n\nدخل فيهم الطائفة المنصورة\" 1.\n\nفيه مسائل:\n\nالأولى: تفسير آية النساء.\n\nالثانية: تفسير آية المائدة.\n\nالثالثة: تفسير آية الكهف.\n\nالرابعة: - وهي أهمها- ما معنى الإيمان بالجبت والطاغوت، هل هو اعتقاد\n\nقلب، أو هو موافقة أصحابها مع بغضها ومعرفة بطلانها؟\n\nالخامسة: قولهم: إن الكفار الذين يعرفون كفرهم أهدى سبيلا من المؤمنين.\n\nالسادسة: - وهي المقصود بالترجمة- أن هذا لا بد أن يوجد في هذه الأمة،\n\nكما تقرر في حديث أبي سعد.\n\nالسابعة: التصريح بوقوعها، أعني عبادة الأوثان في هذه الأمة في جموع\n\nكثيرة.\n\nقال المصنف -رحمه الله-: \" وفيه الآية العظيمة: أنهم مع قلتهم لا يضرهم\n\nمن خذلهم ولا من خالفهم، وفيه البشارة بأن الحق لا يزول بالكلية\". قلت:\n\nواحتج به الإمام أحمد على أن الاجتهاد لا ينقطع ما دامت هذه الطائفة\n\nموجودة.\n\nقوله: \" حتى يأتي أمر الله\" الظاهر أن المراد به ما روي من قبض من بقي من\n\nالمؤمنين بالريح الطيبة; ووقوع الآيات العظام، ثم لا يبقى إلا شرار الناس،\n\nكما روى الحاكم أن عبد الله بن عمر قال: \" لا تقوم الساعة إلا على شرار\n\nالخلق، هم شر أهل الجاهلية \"2. فقال PageV01P277\n\nعقبة بن عامر لعبد الله: اعلم ما تقول، وأما أنا فسمعت النبي صلي الله\n\nعليه وسلم يقول: \" لا تزال عصابة من أمتي يقاتلون على أمر الله ظاهرين لا\n\nيضرهم من خالفهم حتى تأتيهم الساعة وهم على ذلك \"1. قال عبد الله: \" ويبعث\n\nالله ريحا ريحها المسك، ومسها مس الحرير، فلا تترك أحدا في قلبه مثقال ذرة\n\nمن إيمان إلا قبضته; ثم يبقى شرار الناس فعليهم تقوم الساعة \".\n\nوفي صحيح مسلم: \" لا تقوم الساعة حتى لا يقال في الأرض الله الله \" 2.\n\nوعلى هذا فالمراد بقوله في حديث عقبة وما أشبهه: \"حتى تأتيهم الساعة\"\n\nساعتهم. وهي وقت موتهم بهبوب الريح. ذكره الحافظ.\n\nوقد اختلف في محل هذه الطائفة، فقال ابن بطال: إنها تكون ms202 في بيت المقدس،\n\nكما رواه الطبراني من حديث أبي أمامة: \" قيل: يا رسول الله، أين هم؟ قال:\n\nببيت المقدس \"3. وقال معاذ بن جبل رضي الله عنه:\n\n\"هم بالشام\". وفي كلام الطبري ما يدل على أنه لا يجب أن تكون في الشام أو\n\nفي بيت المقدس دائما، بل قد تكون في موضع آخر في بعض الأزمنة. الثامنة:\n\nالعجب العجاب: خروج من يدعي النبوة، مثل المختار مع تكلمه بالشهادتين\n\nوتصريحه بأنه من هذه الأمة. وأن الرسول حق وأن القرآن حق. وفيه أن محمدا\n\nخاتم النبيين، ومع هذا يصدق في هذا كله مع التضاد الواضح. وقد خرج المختار\n\nفي آخر عصر الصحابة وتبعه فئام كثيرة.\n\nالتاسعة: البشارة بأن الحق لا يزول بالكلية، كما زال فيما مضى، بل لا\n\nتزال عليه طائفة.\n\nالعاشرة: الآية العظمى أنهم مع قلتهم لا يضرهم من خذلهم ولا من خالفهم.\n\nالحادية عشرة: أن ذلك الشرط إلى قيام الساعة.\n\nالثانية عشرة: ما فيهن من الآيات العظيمة. منها: إخباره بأن الله زوى له\n\nالمشارق والمغارب، وأخبر بمعنى ذلك فوقع كما أخبر، بخلاف الجنوب والشمال.\n\nوإخباره بأنه أعطي الكنزين.\n\nوإخباره بإجابة دعوته لأمته في الاثنتين.\n\nوإخباره بأنه منع الثالثة.\n\nوإخباره بوقوع السيف وأنه لا يرفع إذا وقع.\n\nوإخباره بظهور المتنبئين في هذه الأمة.\n\nوإخباره ببقاء الطائفة المنصورة.\n\nقلت: ويشهد له الواقع وحال أهل الشام وأهل بيت المقدس، فإنهم من أزمنة\n\nطويلة لا يعرف فيهم من قام بهذا الأمر بعد شيخ الإسلام ابن تيمية رضي الله\n\nعنه وأصحابه في القرن السابع وأول الثامن؛ فإنهم كانوا في زمانهم على الحق\n\nيدعون إليه، ويناظرون عليه، ويجاهدون فيه. وقد يجيء من أمثالهم بعد بالشام\n\nمن يقوم مقامهم بالدعوة إلى الحق والتمسك بالسنة. والله على كل شيء قدير4.\n\nPageV01P278\n\nومما يؤيد هذا أن أهل الحق والسنة في زمن الأئمة الأربعة وتوافر العلماء\n\nفي ذلك الزمان وقبله وبعده لم يكونوا في محل واحد، بل هم في غالب الأمصار\n\nفي الشام منهم الأئمة، وفي الحجاز وفي مصر، وفي العراق واليمن، ms203 وكلهم على\n\nالحق يناضلون، ويجاهدون أهل البدع، ولهم المصنفات التي صارت أعلاما لأهل\n\nالسنة; وحجة على كل مبتدع.\n\nفعلى هذا، فهذه الطائفة قد تجتمع وقد تتفرق، وقد تكون في الشام، وقد تكون\n\nفي غيره، فإن حديث أبي أ",

            "kitab": {
                "text": "إلا بها.\n\nالسابعة: فهم الصحابي للواقع: أن عامة المؤاخاة على أمر الدنيا.\n\nالثامنة: تفسير {وتقطعت بهم الأسباب} 3. PageV01P089\n\nالتاسعة: أن من المشركين من يحب الله حبا شديدا.\n\nالعاشرة: الوعيد على من كان الثمانية أحب إليه منه دينه.\n\nالحادية عشرة: أن من اتخذ ندا تساوي محبته محبة الله فهو الشرك الأكبر.\n\n### | باب (31) قول الله تعالى: {إنما ذلكم الشيطان يخوف أولياءه فلا تخافوهم وخافون إن كنتم مؤمنين}\n\n1 وقوله: {إنما يعمر مساجد الله من آمن بالله واليوم الآخر وأقام الصلاة\n\nوآتى الزكاة ولم يخش إلا الله فعسى أولئك أن يكونوا من المهتدين} 2.\n\nوقوله: {ومن الناس من يقول آمنا بالله فإذا أوذي في الله جعل فتنة الناس\n\nكعذاب الله} 3 -.\n\nعن أبي سعيد رضي الله عنه مرفوعا: \"إن من ضعف اليقين أن ترضي الناس بسخط\n\nالله، وأن تحمدهم على رزق الله، وأن تذمهم على ما لم يؤتك الله. إن رزق\n\nالله لا يجره حرص حريص، ولا يرده كراهية كاره\".\n\nوعن عائشة رضي الله عنها: أن رسول الله صلى الله عليه وسلم قال: ms32\n\n\"من التمس رضى الله بسخط الناس رضي الله عنه وأرضى عنه الناس؛ ومن التمس\n\nرضى الناس بسخط الله سخط الله عليه وأسخط عليه الناس\" رواه ابن حبان في\n\nصحيحه. PageV01P091\n\nفيه مسائل:\n\nالأولي: تفسير آية آل عمران.\n\nالثانية: تفسير آية براءة.\n\nالثالثة: تفسير آية العنكبوت.\n\nالرابعة: أن اليقين يضعف ويقوى.\n\nالخامسة: علامة ضغفه. ومن ذلك هذه الثلاث.\n\nالسادسة: أن إخلاص الخوف لله من الفرائض.\n\nالسابعة: ذكر ثواب من فعله.\n\nالثامنة: ذكر عقاب من تركه.\n\n### | باب (32) قول الله تعالى: {وعلى الله فتوكلوا إن كنتم مؤمن}\n\n1.\n\nوقوله: {إنما المؤمنون الذين إذا ذكر الله وجلت قلوبهم وإذا تليت عليهم\n\nآياته زادتهم إيمانا وعلى ربهم يتوكلون} 2.\n\nوقوله: {يا أيها النبي حسبك الله ومن اتبعك من المؤمنين} 3.\n\nوقوله: {ومن يتوكل على الله فهو حسبه} 4.\n\nوعن ابن عباس رضي الله عنهما قال: \"حسبنا الله ونعم الوكيل قالها إبراهيم\n\nصلى الله عليه وسلم حين ألقي في النار، وقالها محمد صلى الله عليه وسلم حين\n\nقالوا له: {إن الناس قد جمعوا لكم فاخشوهم فزادهم إيمانا وقالوا حسبنا الله\n\nونعم الوكيل} 5\" رواه البخاري والنسائي.\n\nفيه مسائل:\n\nالأولى: أن التوكل من الفرائض.\n\nالثانية: أنه من شروط الإيمان. PageV01P093\n\nالثالثة: تفسير آية الأنفال.\n\nالرابعة: تفسير الآية في آخرها.\n\nالخامسة: تفسير آية الطلاق.\n\nالسادسة: عظم شأن هذه الكلمة أنها قول إبراهيم ومحمد صلى الله عليه وسلم\n\nفي الشدائد.\n\n### | باب (33) قول الله تعالى: {أفأمنوا مكر الله فلا يأمن مكر الله إلا القوم الخاسرون}\n\n1.\n\nوقوله: {ومن يقنط من رحمة ربه إلا الضالون} 2.\n\nوعن ابن عباس رضي الله عنهما أن رسول الله صلى الله عليه وسلم سئل عن\n\nالكبائر؟ فقال: \"الشرك بالله، واليأس من روح الله، والأمن من مكر الله\".\n\nوعن ابن مسعود رضي الله عنه قال: \"أكبر الكبائر: الإشراك بالله، والأمن\n\nمن مكر الله، والقنوط من رحمة الله، واليأس من روح الله\" رواه عبد الرازق.\n\nفيه مسائل:\n\nالأولى: تفسير آية الأعراف.\n\nالثانية: تفسير آية الحجر.\n\nالثالثة: شدة الوعيد فيمن أمن مكر الله.\n\nالرابعة: شدة الوعيد في ms33 القنوط. PageV01P095\n\n### | باب (34) من الإيمان بالله: الصبر على أقدار الله\n\nوقوله تعالى: {ومن يؤمن بالله يهد قلبه والله بكل شيء عليم} 1 قال علقمة:\n\nهو الرجل تصيبه المصيبة، فيعلم أنها من عند الله، فيرضى ويسلم.\n\nوفي صحيح مسلم عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه\n\nوسلم قال: \"اثنتان في الناس هما بهم كفر: الطعن في النسب،",

                "text": "ظهر على هذا تحريم\n\nهذه اللفظة مطلقا لفساد المعنى. 3 وقد تقدم القطع بتحريمه في كلام صاحب\n\nالفروع والإنصاف.\n\nقال المصنف -رحمه الله-: \"وفيه التفطن للإيمان في هذا الموضع\" يشير إلى\n\nأنه الإخلاص.\n\nقال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب \"4.\n\nقوله: \"فأما من قال: مطرنا بفضل الله ورحمته\" فالفضل والرحمة صفتان لله،\n\nومذهب أهل السنة والجماعة: أن ما وصف الله به نفسه ووصفه به رسوله من صفات\n\nالذات: كالحياة PageV01P326\n\nوالعلم، وصفات الأفعال; كالرحمة التي يرحم بها عباده، كلها صفات لله\n\nقائمة بذاته ليست قائمة بغيره، فتفطن لهذا فقد غلط فيه طوائف.\n\nوفي هذا الحديث: إن نعم الله لا يجوز أن تضاف إلا إليه وحده، وهو الذي\n\nيحمد ms241 عليها، وهذه حال أهل التوحيد.\n\nقوله: \"وأما من قال: مطرنا بنوء كذا وكذا\" إلى آخره، تقدم ما يتعلق بذلك.\n\nقال المصنف -رحمه الله-: \"وفيه التفطن للكفر في هذا الموضع\".\n\nيشير إلى أن نسبة النعمة إلى غير الله كفر، ولهذا قطع بعض العلماء\n\nبتحريمه، وإن لم يعتقد تأثير النوء بإنزال المطر; فيكون من كفر النعم، لعدم\n\nنسبتها إلى الذي أنعم بها، ونسبتها إلى غيره، كما سيأتي في قوله تعالى:\n\n{يعرفون نعمت الله ثم ينكرونه} 1.\n\nقال القرطبي في شرح حديث زيد بن خالد: \" وكانت العرب إذا طلع نجم من\n\nالشرق، وسقط آخر من المغرب فحدث عند ذلك مطر أو ريح، فمنهم من ينسبه إلى\n\nالطالع، ومنهم من ينسبه إلى الغارب نسبة إيجاد واختراع، ويطلقون ذلك القول\n\nالمذكور في الحديث. فنهى الشارع عن إطلاق ذلك؛ لئلا يعتقد أحد اعتقادهم ولا\n\nيتشبه بهم في نطقهم\". انتهى.\n\nقوله: \" فمنهم من ينسبه نسبة إيجاد\" يدل على أن بعضهم كان لا يعتقد ذلك،\n\nكما قال تعالى: {ولئن سألتهم من نزل من السماء ماء فأحيا به الأرض من بعد\n\nموتها ليقولن الله قل الحمد لله بل أكثرهم لا يعقلون} 2. فدل على أن منهم\n\nمن يعرف ويقر بأن الله هو الذي أوجد المطر، وقد يعتقد هؤلاء أن للنوء فيه\n\nشيئا من التأثير، والقرطبي في شرحه لم يصرح أن العرب كلهم يعتقدون ذلك\n\nالمعتقد الذي ذكره. فلا اعتراض عليه بالآية للاحتمال المذكور.\n\nولهما من حديث ابن عباس معناه، وفيه: \" قال بعضهم: لقد صدق نوء كذا وكذا.\n\nفأنزل الله هذه الآيات: {فلا أقسم بمواقع النجوم وإنه لقسم لو تعلمون عظيم\n\nقوله: \"ولهما من حديث ابن عباس بمعناه، وفيه: قال بعضهم: \"لقد صدق نوء\n\nكذا وكذا. فأنزل الله هذه الآيات {فلا أقسم بمواقع النجوم وإنه لقسم لو\n\nتعلمون عظيم إنه لقرآن كريم في كتاب مكنون لا يمسه إلا المطهرون تنزيل من\n\nرب العالمين أفبهذا الحديث أنتم مدهنون وتجعلون رزقكم أنكم تكذبون} 1.\n\nوبلفظه عن ابن عباس قال: \"مطر الناس على عهد النبي صلي ms242 الله عليه وسلم،\n\nفقال النبي صلي الله عليه وسلم: أصبح من الناس شاكر، ومنهم كافر. قالوا:\n\nهذه رحمة الله. وقال بعضهم: لقد صدق نوء كذا وكذا \". فقال: فنزلت هذه\n\nالآية: {فلا أقسم بمواقع النجوم} \".\n\nهذا قسم من الله عز وجل يقسم بما يشاء من خلقه على ما شاء. وجواب القسم\n\n{إنه لقرآن كريم} . فتكون \"لا\" صلة لتأكيد النفي; فتقدير الكلام: ليس الأمر\n\nكما زعمتم في القرآن أنه سحر، أو كهانة، بل هو قرآن كريم. قال ابن جرير:\n\nقال بعض أهل العربية: معنى قوله: \" {فلا أقسم} فليس الأمر كما تقولون، ثم\n\nاستؤنف القسم بعد فقيل: أقسم بمواقع النجوم. قال ابن عباس: يعني نجوم\n\nالقرآن، فإنه نزل جملة ليلة القدر من السماء العليا إلى السماء الدنيا، ثم\n\nنزل مفرقا في السنين بعد2، ثم قرأ ابن عباس هذه الآية. ومواقعها: نزولها\n\nشيئا بعد شيء. وقال مجاهد: مواقع النجوم: مطالعها ومشارقها. واختاره ابن\n\nجرير. وعلى هذا فتكون المناسبة بين المقسم به والمقسم عليه- وهو القرآن- من\n\nوجوه:\n\nأحدها: أن النجوم جعلها الله يهتدى بها في ظلمات البر والبحر، وآيات\n\nالقرآن يهتدى بها في ظلمات الغي والجهل، فتلك هداية في الظلمات الحسية،\n\nوالقرآن هداية في الظلمات المعنوية، فجمع بين الهدايتين مع ما في النجوم من\n\nالزينة الظاهرة، وفي القرآن من الزينة الباطنة، ومع ما في النجوم من الرجوم\n\nللشياطين، وفي القرآن من رجوم شياطين الجن والإنس. والنجوم آياته المشهودة\n\nالعيانية، والقرآن آياته المتلوة السمعية، مع ما في مواقعها عند الغروب من\n\nالعبرة والدلالة على آياته القرآنية ومواقعها عند النزول. ذكره ابن القيم\n\nرحمه الله.\n\nوقوله: {وإنه لقسم لو تعلمون عظيم} 3 قال ابن كثير: أي وإن هذا القسم\n\nالذي أقسمت به لقسم عظيم لو تعلمون عظمته لعظمتم المقسم به عليه.\n\nPageV01P328\n\nوقوله: {إنه لقرآن كريم} 1 هذا هو المقسم عليه، وهو القرآن، أي إنه وحي\n\nالله وتنزيله وكلامه، لا كما يقول الكفار: إنه سحر أو كهانة، أو شعر. بل هو\n\nقرآن كريم أي عظيم كثير الخير؛ لأنه كلام ms243 الله.\n\nقال ابن القيم -رحمه الله تعالى-: \" فوصفه بما يقتضي حس",

                "text": "- استنكارا\n\nلذلك – فقال: ما فرق هؤلاء؟ يجدون رقة عند محكمه، ويهلكون عند متشابهه\"\n\nانتهى.\n\nولما سمعت قريش رسول الله صلى الله عليه وسلم يذكر \" الرحمن \" أنكروا\n\nذلك، فأنزل الله فيهم: {وهم يكفرون بالرحمن} 3.\n\nفيه مسائل:\n\nالأولى: عدم الإيمان بجحد شيء من الأسماء والصفات.\n\nالثانية: تفسير آية الرعد. PageV01P106\n\nالثالثة: ترك التحديث بما لا يفهم السامع.\n\nالرابعة: ذكر العلة: أنه يفضي إلى تكذيب الله ورسوله، ولو لم يتعمد\n\nالمنكر.\n\nالخامسة: كلام ابن عباس لمن استنكر شيئا من ذلك، وأنه أهلكه.\n\n### | باب (40) قول الله تعالى: {يعرفون نعمت الله ثم ينكرونها وأكثرهم الكافرون}\n\n1.\n\nقال مجاهد ما معناه: ms37 \"هو قول الرجل: هذا مالي ورثته عن آبائي\".\n\nوقال عون بن عبد الله: \"يقولون: لولا فلان لم يكن كذا\". وقال قتيبة: \"\n\n\"يقولون: هذا بشفاعة آلهتنا\".\n\nوقال أبو العباس - بعد حديث زيد بن خالد الذي فيه: \"أن الله تعالى قال:\n\nأصبح من عبادي مؤمن بي وكافر\" 2 - الحديث وقد تقدم -: وهذا كثير في الكتاب\n\nوالسنة، يذم سبحانه من يضيف إنعامه إلى غيره ويشرك به.\n\nقال بعض السلف: هو كقولهم: كانت الريح طيبة، والملاح حاذقا، ونحو ذلك مما\n\nهو جار على ألسنة كثير.\n\nفيه مسائل:\n\nالأولى: تفسير معرفة النعمة وإنكارها.\n\nالثانية: معرفة أن هذا جار على ألسنة كثير.\n\nالثالثة: تسمية هذا الكلام إنكارا للنعمة.\n\nالرابعة: اجتماع الضدين في القلب. PageV01P108\n\n### | باب (41) قول الله تعالى: {فلا تجعلوا لله أندادا وأنتم تعلمون}\n\n1.\n\nقال ابن عباس في الآية: \"الأنداد: هو الشرك، أخفى من دببيب النمل على\n\nصفاة سوداء في ظلمة الليل\". وهو أن تقول: والله وحياتك يا فلان، وحياتي،\n\nوتقول: لولا كليبة هذا لأتانا اللصوص. ولولا البط في الدار لأتانا اللصوص.\n\nوقول الرجل لصاحبه: ما شاء الله وشئت. وقول الرجل: لولا الله وفلان. لا\n\nتجعل فيها فلانا ; هذا كله به شرك \" رواه ابن أبي حاتم.\n\nوعن عمر بن الخطاب رضي الله عنه أن رسول الله صلى الله عليه وسلم قال:\n\n\"من حلف بغير الله قد كفر أو أشرك\" 2 رواه الترمذي، وحسنه وصححه الحاكم.\n\nوقال ابن مسعود: \"لأن أحلف بالله كاذبا أحب إلي من أن أحلف بغيره صادقا\".\n\nوعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"لا تقولوا: ما\n\nشاء الله وشاء فلان، ولكن قولوا: ما شاء الله ثم شاء فلان\" 3 رواه أبو داود\n\nبسند صحيح. PageV01P109\n\nوجاء عن إبراهيم النخعي: \"أنه يكره أن يقول أعوذ بالله وبك. ويجوز أن\n\nيقول: بالله ثم بك. قال: ويقول: لولا الله ثم فلان؛ ولا تقولوا ولولا الله\n\nوفلان\".\n\nفيه مسائل:\n\nالأولى: تفسير آية البقرة في الأنداد.\n\nالثانية: أن الصحابة رضي الله عنهم يفسرون الآية النازلة ms38 في الشرك الأكبر\n\nأنها 1 تعم الأصغر.\n\nالثالثة: أن الحلف بغير الله شرك.\n\nالرابعة: أنه إذا حلف بغير الله صادقا فهو أكبر من اليمين الغموس.\n\nالخامسة: الفرق بين الواو وثم في اللفظ. PageV01P110\n\n### | باب (42) ما جاء فيمن لم يقنع بالحلف بالله\n\nعن عمر رضي الله عنهما: أن رسول الله صلى الله عليه وسلم قال: \"لا تحلفوا\n\nبآبائكم; من حلف له بالله فليصدق ; ومن حلف له بالله فليرض ; ومن لم يرض\n\nفليس من الله\" 1 رواه ابن ماجه بسند حسن.\n\nفيه مسائل:\n\nالأولى: النهي عن الحلف بالآباء.\n\nالثانية: الأمر للمحلوف له بالله أن يرضى.\n\nالثالثة: وعيد من لم يرض. PageV01P111\n\n### | باب (43) قول: ما شاء الله وشئت\n\nعن قتيلة: \"أن يهوديا أتى النبي صلى الله عليه وسلم فقال: إنكم تشركون،\n\nتقولون: ما شاء الله وشئت، وتقولون: والكعبة. فأمرهم النبي صلى الله عليه\n\nوسلم إذا أرادوا",

            "fath": {
                "text": "ن محمود بن لبيد قال: \" خرج علينا رسول الله\n\nصلى الله عليه وسلم فقال: يا أيها الناس، إياكم وشرك السرائر، قالوا: يا\n\nرسول الله، وما شرك السرائر؟ قال: يقوم الرجل فيصلي فيزين صلاته لما يرى من\n\nنظر الرجل إليه، فذلك شرك السرائر \" 3.\n\nقوله: \"عن أبي سعيد الخدري\" وتقدم.\n\nقوله: \"الشرك الخفي\" سماه خفيا؛ لأن صاحبه يظهر أن عمله لله وقد قصد به\n\nغيره، أو شركه فيه بتزيين صلاته لأجله. وعن شداد بن أوس قال: \" كنا نعد\n\nالرياء على عهد رسول الله صلى الله عليه وسلم\n\nفيه مسائل:\n\nالأولى: تفسير آية الكهف.\n\nالثانية: الأمر العظيم في رد العمل الصالح إذا دخله شيء لغير الله.\n\nالثالثة: ذكر السبب الموجب لذلك وهو كمال الغنى.\n\nالرابعة: أن من الأسباب: أنه تعالى خير الشركاء.\n\nالخامسة: خوف النبي صلى الله عليه وسلم على أصحابه من الرياء.\n\nالسادسة: أنه فسر ذلك بأن يصلي المرء لله لكن يزينها لما ms281 يرى من نظر رجل\n\nإليه.\n\nالشرك الأصغر \" 4. رواه ابن أبي الدنيا في كتاب الإخلاص، وابن جرير في\n\nالتهذيب، والطبراني والحاكم وصححه.\n\nقال ابن القيم: \" وأما الشرك الأصغر فكيسير الرياء والتصنع للخلق والحلف\n\nبغير الله، وقول الرجل للرجل: ما شاء الله وشئت، وهذا من الله ومنك، وأنا\n\nبالله وبك، وما لي PageV01P371\n\nإلا الله وأنت، وأنا متوكل على الله وعليك، ولولا الله وأنت لم يكن كذا\n\nوكذا. وقد يكون هذا شركا أكبر بحسب حال قائله ومقصده\". انتهى.\n\nولا خلاف أن الإخلاص شرط لصحة العمل وقبوله، وكذلك المتابعة، كما قال\n\nالفضيل بن عياض -رحمه الله- في قوله تعالى: {ليبلوكم أيكم أحسن عملا} 1.\n\nقال: \"أخلصه وأصوبه، قيل: يا أبا علي، ما أخلصه وأصوبه؟ قال: إن العمل إذا\n\nكان خالصا ولم يكن صوابا لم يقبل، وإذا كان صوابا ولم يكن خالصا لم يقبل\n\nحتى يكون خالصا صوابا، فالخالص ما كان لله، والصواب ما كان على السنة\".\n\nوفي الحديث عن الفوائد: شفقة النبي صلى الله عليه وسلم على أمته ونصحه\n\nلهم، وأن الرياء أخوف على الصالحين من فتنة الدجال. فإذا كان النبي صلى\n\nالله عليه وسلم يخافه على سادات الأولياء مع قوة إيمانهم وعلمهم، فغيرهم\n\nممن هو دونهم بأضعاف أولى بالخوف من الشرك أصغره وأكبره. PageV01P372\n\n### | باب: \" من الشرك إرادة الإنسان بعمله الدنيا\"\n\nوقوله تعالى: {من كان يريد الحياة الدنيا وزينتها نوف إليهم أعمالهم فيها\n\nوهم فيها لا يبخسون أولئك الذين ليس لهم في الآخرة إلا النار وحبط ما صنعوا\n\nفيها وباطل ما كانوا يعملون} 1. PageV01P372\n\nالتوحيد الواجب، ويحبط الأعمال، وهو أعظم من الرياء، لأن مريد الدنيا قد\n\nتغلب إرادته تلك على كثير من عمله، وأما الرياء فقد يعرض له في عمل دون\n\nعمل، ولا يسترسل معه، والمؤمن يكون حذرا من هذا وهذا.\n\nقال: \"وقوله تعالى: {من كان يريد الحياة الدنيا وزينتها نوف إليهم\n\nأعمالهم فيها وهم فيها لا يبخسون أولئك الذين ليس لهم في الآخرة إلا النار\n\nوحبط ما صنعوا فيها وباطل ما كانوا يعملون} \".\n\nقال ابن عباس ms282 رضي الله عنه: \"من كان يريد الحياة الدنيا\" أي ثوابها.\n\nوزينتها: أي مالها. نوف أي نوفر لهم ثواب أعمالهم بالصحة والسرور في المال\n\nوالأهل والولد. \"وهم فيها لا يبخسون\" لا ينقصون، ثم نسختها {من كان يريد\n\nالعاجلة عجلنا له فيها ما نشاء لمن نريد} 1 الآيتين. رواه النحاس في ناسخه.\n\nقوله: \"ثم نسختها\" أي قيدتها. فلم تبق الآية على إطلاقها2. وقال قتادة: \"\n\nمن كانت الدنيا همه وطلبته ونيته جازاه الله بحسناته في الدنيا، ثم يفضي\n\nإلى الآخرة وليس له حسنة يعطى بها جزاء. وأما المؤمن فيجازى بحسناته في\n\nالدنيا ويثاب عليها في الآخرة \" ذكره ابن جرير بسنده، ثم ساق حديث أبي\n\nهريرة 3 عن ابن المبارك عن حيوة بن شريح قال: حدثني الوليد ابن أبي الوليد\n\nأبو عثمان أن عقبة بن مسلم حدثه أن شفي بن ماتع الأصبحي حدثه \"أنه دخل\n\nالمدينة فإذا هو برجل قد اجتمع عليه الناس، فقال: من هذا؟ فقالوا: أبو\n\nهريرة. قال: فدنوت منه حتى قعدت بين يديه، وهو يحدث الناس. فلما سكت وخلا\n\nقلت: أنشدك بحق وبحق لما حدثتني حديثا سمعته من رسول الله صلى الله عليه\n\nوسلم عقلته وعلمته. قال: فقال أبو هريرة: أفعل، لأحدثنك حديثا حدثنيه رسول\n\nالله PageV01P373\n\nصلى الله عليه وسلم في هذا البيت ما فيه أحد غيري وغيره، ثم نشغ أبو\n\nهريرة نشغة1 ثم أفاق فقال: لأحدثنك حديثا حدثنيه رسول الله صلى الله عليه\n\nوسلم في هذا البيت ما فيه غيري أحد وغيره. ثم نشغ أبو هريرة نشغة أخرى، ثم\n\nمال خارا على وجهه; واشتد به طويلا. ثم أفاق فقال: حدثني رسول الله صلى\n\nالله عليه وسلم: \" إن الله -تبارك وتعالى- إذا كان يوم القيامة نزل إلى\n\nالقيامة ليقضي بينهم، وكل أمة جاثية. فأول من يدعو به رجل جمع القرآن، ورجل\n\nقتل في سبيل الله، ورجل كثير المال. فيقول الله تبارك وتعالى للقارئ: ألم\n\nأعلمك ما أنزلت على رسولي؟ قال: ب",

            "kitab": {
                "text": "وأتى الأعمى في صورته،\n\nفقال: رجل مسكين وابن سبيل قد انقطعت بي الحبال في سفري، فلا بلاغ لي اليوم\n\nإلا بالله ثم بك. أسألك بالذي رد عليك بصرك شاة أتبلغ بها في سفري. فقال:\n\nقد كنت أعمى فرد الله إلي بصري، فخذ ما شئت ودع ما شئت، فوالله لا أجهدك\n\nاليوم بشيء أخذته لله. فقال: أمسك\n\nمالك فإنما ابتليتم، فقد رض ي الله عنك وسخط على صاحبيك\".\n\nفيه مسائل:\n\nالأولى: تفسير الآية.\n\nالثانية: ما معنى: {ليقولن هذا لي} 1.\n\nالثالثة: ما معنى قوله: { (إنما أوتيته على علم عندي (} 2.\n\nالرابعة: ما في هذه القصة العجيبة من العبر العظيمة. PageV01P121\n\n### | باب (49) قول الله تعالى: {فلما آتاهما صالحا جعلا له شركاء فيما آتاهما فتعالى الله عما يشركون}\n\n1\n\nقال ابن حزم: اتفقوا على تحريم كل اسم معبد لغير الله كعبد عمرو، وعبد\n\nالكعبة، وما أشبه ذلك حاشى عبد المطلب. وعن ابن عباس في الآية: \"قال لما\n\nتغشاها آدم حملت فأتاهما إبليس فقال: إني صاحبكما الذي أخرجتكما من الجنة\n\nلتطيعاني 2 أو لأجعلن له قرني أيل، فيخرج من بطنك فيشقه، ولأفعلن ولأفعلن\n\nيخوفهما، سمياه عبد الحارث. فأبيا أن يطيعاه فخرج ميتا، ثم حملت فأتاهما\n\nفقال مثل قوله، فأبيا أن يطيعاه، فخرج ميتا. ثم حملت فأتاهما فذكر لهما\n\nفأدركهما حب الولد فسمياه عبد الحارث، فذلك قوله {جعلا له شركاء فيما\n\nآتاهما} \" رواه ابن أبي حاتم.\n\nوله بسند صحيح عن قتادة قال: \"شركاء في طاعته ولم يكن في عبادته\".\n\nPageV01P122\n\nوله بسند صحيح عن مجاهد في قوله: {لئن آتيتنا صالحا} قال: \"أشفقا أن لا\n\nيكون إنسانا\" وذكر معناه عن الحسن وسعيد وغيرهما.\n\nفيه مسائل:\n\nالأولى: تحريم كل اسم معبد لغير الله.\n\nالثانية: تفسير الآية.\n\nالثالثة: أن هذا الشرك في مجرد تسمية لم تقصد حقيقتها.\n\nالرابعة: أن هبة الله للرجل البنت السوية من النعم.\n\nالخامسة: ذكر السلف ms43 الفرق بين الشرك في الطاعة والشرك في العبادة.\n\n### | باب (50) قول الله تعالى: {ولله الأسماء الحسنى فادعوه بها وذروا الذين يلحدون في أسمائه}\n\n1\n\nذكر ابن أبي حاتم عن ابن عباس: ?\" {يلحدون في أسمائه} : يشركون\". وعنه:\n\n\"سموا اللات من الإله، والعزى من العزيز\".\n\nوعن الأعمش: \"يدخلون فيها ما ليس منها\".\n\nفيه مسائل:\n\nالأولى: إثبات الأسماء.\n\nالثانية: كونها حسنى.\n\nالثالثة: الأمر بدعائه بها.\n\nالرابعة: ترك من عارض من الجاهلين الملحدين.\n\nالخامسة: تفسير الإلحاد فيها.\n\nالسادسة: وعيد من ألحد. PageV01P124\n\n### | باب (51) لا يقال: السلام على الله\n\nفي الصحيح عن ابن مسعود رضي الله عنه قال: \"كنا إذا كنا مع النبي صلى\n\nالله عليه وسلم في الصلاة قلنا: السلام على الله من عباده، السلام على فلان\n\nوفلان فقال النبي صلى الله عليه وسلم: لا تقولوا السلام على الله، فإن الله\n\nهو السلام\" 1.\n\nفيه مسائل:\n\nالأولى: تفسير السلام.\n\nالثانية: أنه تحية.\n\nالثالثة: أنها لا تصلح لله.\n\nالرابعة: العلة في ذلك.\n\nالخامسة: تعليمهم التحية التي تصلح لله. PageV01P125\n\n### | باب (51) قول: اللهم اغفر لي إن شئت\n\nفي الصحيح عن أبي هريرة: أن رسول الله صلى الله عليه وسلم قال: \"لا يقل\n\nأحدكم: اللهم اغفر لي إن شئت، اللهم ارحمني إن شئت، ليعزم المسألة ; فإن\n\nالله لا مكره له\" 1.\n\nولمسلم: \"وليعظم الرغبة، فإن الله لا يتعاظمه شيء أعطاه\" 2.\n\nفيه مسائل:\n\nالأولى: النهي عن الاستثناء في الدعاء.\n\nالثانية: بيان العلة في ذلك.\n\nالثالثة: قوله: \"ليعزم المسألة\".\n\nالرابعة: إعظام الرغبة.\n\nالخامسة: التعليل لهذا الأمر. PageV01P126\n\n### | باب (53) لا يقول: عبدي وأمتي\n\nفي الصحيح عن أبي هريرة رضي الله عنه أن رسول الله",

                "text": "فخالفوا ما بلغ به الأمة\n\nوأخبر به عن نفسه صلى الله عليه وسلم، فعاملوه بما نهاهم عنه من الشرك\n\nبالله والتعلق على غير الله حتى قال قائلهم:\n\nيا أكرم الخلق ما لي من ألوذ به ... سواك عند حلول الحادث العمم\n\nإن لم تكن في معادي آخذا بيدي ... فضلا وإلا فقل يا زلة القدم\n\nPageV01P414\n\nفإن من جودك الدنيا وضرتها ... ومن علومك علم اللوح والقلم\n\nفانظر إلى هذا الجهل العظيم حيث اعتقد أنه لا نجاة له إلا بعياذه ولياذه\n\nبغير الله، وانظر إلى هذا الإطراء العظيم الذي تجاوز الحد في الإطراء الذي\n\nنهى عنه صلى الله عليه وسلم بقوله: \" لا تطروني كما أطرت النصارى ابن مريم،\n\nإنما أنا عبد فقولوا: عبد الله ورسوله \". رواه مالك وغيره1 2. وقد قال\n\nتعالى: {قل لا أقول لكم عندي خزائن الله ولا أعلم الغيب ولا أقول لكم إني\n\nملك} 3.\n\nوعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \" لا تقولوا:\n\nما شاء الله وشاء فلان، ولكن قولوا: ما شاء الله ثم شاء فلان \" 4 رواه أبو\n\nداود بسند صحيح.\n\nوجاء عن إبراهيم النخعي \" أنه يكره أعوذ بالله وبك. ويجوز أن يقول: بالله\n\nثم بك. قال ويقول: لولا الله ثم فلان، ولا تقولوا: لولا الله وفلان\".\n\nفانظر إلى هذه المعارضة العظيمة للكتاب والسنة والمحادة لله ورسوله. وهذا\n\nالذي يقوله هذا الشاعر5 هو الذي في نفوس كثير خصوصا ممن يدعون العلم\n\nوالمعرفة. ورأوا قراءة هذه المنظومة ونحوها لذلك وتعظيمها من القربات فإنا\n\nلله وإنا إليه راجعون.\n\nقوله: \"وعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \" لا\n\nتقولوا: ما شاء الله وشاء فلان، ولكن قولوا: ما شاء الله، ثم شاء فلان \".\n\nرواه أبو داود بسند صحيح\".\n\nوذلك لأن المعطوف بالواو يكون مساويا للمعطوف عليه، لكونها إنما وضعت\n\nلمطلق الجمع، ms322 فلا تقتضي ترتيبا ولا تعقيبا. وتسوية المخلوق بالخالق شرك إن\n\nكان في الأصغر- مثل هذا- فهو أصغر، وإن كان في الأكبر فهو أكبر، كما قال\n\nالله تعالى عنهم في الدار الآخرة: {تالله إن كنا لفي ضلال مبين إذ نسويكم\n\nبرب العالمين} 6 بخلاف المعطوف بثم؛ فإن المعطوف بها يكون متراخيا عن\n\nالمعطوف عليه بمهملة، فلا محذور لكونه صار تابعا. PageV01P415\n\nقوله: \"وعن إبراهيم النخعي \"أنه يكره أن يقول الرجل: أعوذ بالله وبك.\n\nويجوز أن  اليمين فأحلفه، فلا ريب أنه يجب عليه الرضا.\n\nوأما إذا كان فيما يجري بين الناس مما قد يقع في الاعتذارات من بعضهم لبعض\n\nونحو ذلك، فهذا من حق المسلم على المسلم أن يقبل منه إذا حلف له مع",

;

    // Storage
    let storage = JSON.parse(localStorage.getItem('mirqat_tawhid_v1') || '{}');
    if (!storage.fontScale) storage.fontScale = 22;
    if (!storage.lineHeight) storage.lineHeight = 'مريح';
    if (!storage.tashkeel) storage.tashkeel = false;
    if (!storage.expandedNodes) storage.expandedNodes = [];
    if (!storage.bookmarks) storage.bookmarks = [];
    if (!storage.notes) storage.notes = {};
    if (!storage.pinned) storage.pinned = [];

    // Arabic normalization
    function normalizeArabic(text) {
      return text
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي');
    }

    // Save storage
    function saveStorage() {
      localStorage.setItem('mirqat_tawhid_v1', JSON.stringify(storage));
    }

    // Build sidebar tree
    function buildSidebar() {
      const tree = document.getElementById('sidebarTree');
      const mobileTree = document.getElementById('mobileSidebarTree');
      tree.innerHTML = '';
      mobileTree.innerHTML = '';

      const rububiyya = DB.topics.filter(t => t.categories.includes('الربوبية'));
      const aluhiyya = DB.topics.filter(t => t.categories.includes('الألوهية'));

      // الربوبية
      const rubDiv = document.createElement('div');
      rubDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('rub')">▼ الربوبية</button>
        <div id="rub" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(rubDiv);
      mobileTree.appendChild(rubDiv.cloneNode(true));

      rububiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#rub').appendChild(node);
      });

      // الألوهية
      const uluDiv = document.createElement('div');
      uluDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('ulu')">▼ الألوهية</button>
        <div id="ulu" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(uluDiv);
      mobileTree.appendChild(uluDiv.cloneNode(true));

      aluhiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#ulu').appendChild(node);
      });
    }

    function toggleGroup(id) {
      const el = document.getElementById(id);
      if (el.style.display === 'none') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    // Load topic
    function loadTopic(topicId) {
      const topic = DB.topics.find(t => t.id === topicId);
      if (!topic) return;

      document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
      // Highlight active (simplified)
      const activeNodes = document.querySelectorAll('.tree-node');
      for (let n of activeNodes) {
        if (n.textContent === topic.title) {
          n.classList.add('active');
        }
      }

      // Update title
      document.getElementById('topicTitle').textContent = topic.title;
      document.getElementById('topicTitlePin').textContent = topic.title;

      // Categories
      const catDiv = document.getElementById('topicCategories');
      catDiv.innerHTML = topic.categories.map(c => `<span class="px-2 py-1 bg-accent-soft text-accent rounded text-sm">${c}</span>`).join('');

      // Matn
      const matnDiv = document.getElementById('matnContent');
      const matnDivPin = document.getElementById('matnContentPin');
      matnDiv.innerHTML = renderText(topic.kitab);
      matnDivPin.innerHTML = renderText(topic.kitab);

      // Sharh
      const sharhDiv = document.getElementById('sharhContent');
      const sharhDivPin = document.getElementById('sharhContentPin');
      sharhDiv.innerHTML = renderText(topic.fath, true);
      sharhDivPin.innerHTML = renderText(topic.fath, true);

      // Fatawa
      const fatawaDiv = document.getElementById('fatawaContent');
      const fatawaDivPin = document.getElementById('fatawaContentPin');
      fatawaDiv.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-4 bg-surface rounded-lg border border-divider">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-warn/10 text-warn px-2 py-1 rounded text-xs">مجموع الفتاوى</span>
            ${f.verificationStatus === 'placeholder' ? '<span class="badge-unverified">غير مُدقّق</span>' : ''}
          </div>
          <div class="fatawa-text">${renderPlaceholder(f.quote)}</div>
          <div class="text-xs text-muted mt-2">${f.source.book} ${f.source.volume} ص ${f.source.page} - ${f.concept}</div>
        </div>
      `).join('');
      fatawaDivPin.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-2 bg-surface rounded border border-divider mb-2">
          <div class="text-xs mb-1">${renderPlaceholder(f.quote).substring(0, 100)}...</div>
        </div>
      `).join('');

      // Notes
      document.getElementById('notesTextarea').value = storage.notes[topicId] || '';

      storage.lastTopicId = topicId;
      saveStorage();
    }

    function renderText(field, isSharh = false) {
      let text = renderPlaceholder(field.text);
      if (isSharh) {
        return `<div class="p-4">${text}</div>`;
      }
      return text;
    }

    function renderPlaceholder(text) {
      if (text.includes('[نص توضيحي')) {
        return text.replace('[نص توضيحي — يُراجع الأصل المطبوع] ', '') + ' <span class="badge-unverified">غير مُدقّق</span>';
      }
      return text;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      buildSidebar();
      
      // Banner
      document.getElementById('dismissBanner').onclick = () => {
        document.getElementById('verificationBanner').style.display = 'none';
      };

      // Font slider
      document.getElementById('fontSlider').oninput = (e) => {
        document.documentElement.style.setProperty('--font-scale', e.target.value + 'px');
        document.getElementById('fontSizeLabel').textContent = e.target.value + 'px';
        storage.fontScale = e.target.value;
        saveStorage();
      };

      // Line height
      document.getElementById('lineHeightBtn').onclick = () => {
        if (document.body.classList.contains('line-compressed')) {
          document.body.classList.remove('line-compressed');
          document.body.classList.add('line-relaxed');
          document.getElementById('lineHeightBtn').textContent = 'مريح';
          storage.lineHeight = 'مريح';
        } else {
          document.body.classList.remove('line-relaxed');
          document.body.classList.add('line-compressed');
          document.getElementById('lineHeightBtn').textContent = 'مضغوط';
          storage.lineHeight = 'مضغوط';
        }
        saveStorage();
      };

      // Notes
      document.getElementById('notesTextarea').oninput = (e) => {
        if (storage.lastTopicId) {
          storage.notes[storage.lastTopicId] = e.target.value;
          saveStorage();
          const saved = document.getElementById('notesSaved');
          saved.classList.remove('hidden');
          setTimeout(() => saved.classList.add('hidden'), 1000);
        }
      };

      // Mobile menu
      document.getElementById('mobileMenuBtn').onclick = () => {
        document.getElementById('mobileDrawer').classList.add('open');
        document.getElementById('mobileDrawerOverlay').classList.remove('hidden');
      };
      document.getElementById('closeDrawer').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };
      document.getElementById('mobileDrawerOverlay').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };

      // Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          // Simplified tab switching
        };
      });

      // Pin
      document.getElementById('pinBtn').onclick = () => {
        document.getElementById('normalLayout').classList.toggle('hidden');
        document.getElementById('pinLayout').classList.toggle('hidden');
      };

      // Load first topic
      if (DB.topics.length > 0) {
        loadTopic(DB.topics[0].id);
      }

      // Apply saved settings
      document.documentElement.style.setProperty('--font-scale', storage.fontScale + 'px');
      document.getElementById('fontSlider').value = storage.fontScale;
      document.getElementById('fontSizeLabel').textContent = storage.fontScale + 'px';
      if (storage.lineHeight === 'مضغوط') {
        document.body.classList.add('line-compressed');
        document.getElementById('lineHeightBtn').textContent = 'مضغوط';
      } else {
        document.body.classList.add('line-relaxed');
        document.getElementById('lineHeightBtn').textContent = 'مريح';
      }
    });
  </script>
