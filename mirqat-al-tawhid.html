<html lang="ar" dir="rtl">

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-scale: 22px;
      --line-height: 2.1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #fdfbf7;
      color: #2d2d2d;
      font-size: 16px;
      line-height: 1.8;
    }

    .font-amiri {
      font-family: 'Amiri', serif;
    }

    .base-text {
      font-family: 'Amiri', serif;
      font-size: var(--font-scale);
      line-height: var(--line-height);
      text-align: justify;
      max-width: 68ch;
    }

    .fath-text {
      font-family: 'Amiri', serif;
      font-size: calc(var(--font-scale) * 0.92);
      line-height: var(--line-height);
      text-align: justify;
    }

    .fatawa-text {
      font-family: 'Amiri', serif;
      font-size: calc(var(--font-scale) * 0.95);
      line-height: var(--line-height);
      text-align: justify;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: #e5e0d5;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #0f5132;
      border-radius: 3px;
    }

    mark {
      background-color: #fbbf24;
      color: #92400e;
      padding: 0 2px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .focus-ring:focus-visible {
      outline: 2px solid #0f5132;
      outline-offset: 2px;
    }

    .tree-node.active {
      background-color: #e8f0ec;
      color: #0f5132;
      font-weight: 600;
      position: relative;
    }

    .tree-node.active::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: #0f5132;
    }

    .drawer {
      transform: translateX(100%);
      transition: transform 150ms ease-in-out;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .tab-btn.active {
      background-color: #0f5132;
      color: white;
    }

    .fath-quote {
      border-right: 2px solid rgba(15, 81, 50, 0.3);
      padding-right: 0.75rem;
      opacity: 0.8;
    }

    .fatawa-card {
      border-right: 4px solid #b45309;
    }

    .badge-unverified {
      background-color: #fef3c7;
      color: #b45309;
      font-size: 0.75rem;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
    }

    .line-compressed {
      --line-height: 1.8;
    }

    .line-relaxed {
      --line-height: 2.1;
    }
  </style>
</head>

<body class="bg-bg text-text">
  <!-- Verification Banner -->

          autocomplete="off">
        <div id="searchResults" class="absolute top-full mt-1 w-full bg-surface border border-divider rounded-lg shadow-lg max-h-96 overflow-y-auto hidden scrollbar-thin"></div>
      </div>
      <div class="flex items-center gap-2">
        <select id="categoryFilter" class="px-3 py-2 border border-divider rounded-lg focus-ring bg-surface text-text">
          <option value="الكل">الكل</option>
          <option value="الربوبية">الربوبية</option>
          <option value="الألوهية">الألوهية</option>

      </div>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="tashkeelToggle" class="focus-ring">

      </label>
    </div>
  </header>

          </div>
        </div>
      </div>
    </main>

        {

              verificationStatus: "placeholder",
              source: { book: "مجموع الفتاوى", volume: "١", page: "١٢٠" },
              concept: "الرياء والشرك الأصغر"
            }
          ],
          relatedTopicIds: ["t1", "t4"]
        }
      ]
    };

    // Storage
    let storage = JSON.parse(localStorage.getItem('mirqat_tawhid_v1') || '{}');
    if (!storage.fontScale) storage.fontScale = 22;
    if (!storage.lineHeight) storage.lineHeight = 'مريح';
    if (!storage.tashkeel) storage.tashkeel = false;
    if (!storage.expandedNodes) storage.expandedNodes = [];
    if (!storage.bookmarks) storage.bookmarks = [];
    if (!storage.notes) storage.notes = {};
    if (!storage.pinned) storage.pinned = [];

    // Arabic normalization
    function normalizeArabic(text) {
      return text
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي');
    }

    // Save storage
    function saveStorage() {
      localStorage.setItem('mirqat_tawhid_v1', JSON.stringify(storage));
    }

    // Build sidebar tree
    function buildSidebar() {
      const tree = document.getElementById('sidebarTree');
      const mobileTree = document.getElementById('mobileSidebarTree');
      tree.innerHTML = '';
      mobileTree.innerHTML = '';

      const rububiyya = DB.topics.filter(t => t.categories.includes('الربوبية'));
      const aluhiyya = DB.topics.filter(t => t.categories.includes('الألوهية'));

      // الربوبية
      const rubDiv = document.createElement('div');
      rubDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('rub')">▼ الربوبية</button>
        <div id="rub" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(rubDiv);
      mobileTree.appendChild(rubDiv.cloneNode(true));

      rububiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#rub').appendChild(node);
      });

      // الألوهية
      const uluDiv = document.createElement('div');
      uluDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('ulu')">▼ الألوهية</button>
        <div id="ulu" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(uluDiv);
      mobileTree.appendChild(uluDiv.cloneNode(true));

      aluhiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#ulu').appendChild(node);
      });
    }

    function toggleGroup(id) {
      const el = document.getElementById(id);
      if (el.style.display === 'none') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    // Load topic
    function loadTopic(topicId) {
      const topic = DB.topics.find(t => t.id === topicId);
      if (!topic) return;

      document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
      // Highlight active (simplified)
      const activeNodes = document.querySelectorAll('.tree-node');
      for (let n of activeNodes) {
        if (n.textContent === topic.title) {
          n.classList.add('active');
        }
      }

      // Update title
      document.getElementById('topicTitle').textContent = topic.title;
      document.getElementById('topicTitlePin').textContent = topic.title;

      // Categories
      const catDiv = document.getElementById('topicCategories');
      catDiv.innerHTML = topic.categories.map(c => `<span class="px-2 py-1 bg-accent-soft text-accent rounded text-sm">${c}</span>`).join('');

      // Matn
      const matnDiv = document.getElementById('matnContent');
      const matnDivPin = document.getElementById('matnContentPin');
      matnDiv.innerHTML = renderText(topic.kitab);
      matnDivPin.innerHTML = renderText(topic.kitab);

      // Sharh
      const sharhDiv = document.getElementById('sharhContent');
      const sharhDivPin = document.getElementById('sharhContentPin');
      sharhDiv.innerHTML = renderText(topic.fath, true);
      sharhDivPin.innerHTML = renderText(topic.fath, true);

      // Fatawa
      const fatawaDiv = document.getElementById('fatawaContent');
      const fatawaDivPin = document.getElementById('fatawaContentPin');
      fatawaDiv.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-4 bg-surface rounded-lg border border-divider">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-warn/10 text-warn px-2 py-1 rounded text-xs">مجموع الفتاوى</span>
            ${f.verificationStatus === 'placeholder' ? '<span class="badge-unverified">غير مُدقّق</span>' : ''}
          </div>
          <div class="fatawa-text">${renderPlaceholder(f.quote)}</div>
          <div class="text-xs text-muted mt-2">${f.source.book} ${f.source.volume} ص ${f.source.page} - ${f.concept}</div>
        </div>
      `).join('');
      fatawaDivPin.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-2 bg-surface rounded border border-divider mb-2">
          <div class="text-xs mb-1">${renderPlaceholder(f.quote).substring(0, 100)}...</div>
        </div>
      `).join('');

      // Notes
      document.getElementById('notesTextarea').value = storage.notes[topicId] || '';

      storage.lastTopicId = topicId;
      saveStorage();
    }

    function renderText(field, isSharh = false) {
      let text = renderPlaceholder(field.text);
      if (isSharh) {
        return `<div class="p-4">${text}</div>`;
      }
      return text;
    }

    function renderPlaceholder(text) {
      if (text.includes('[نص توضيحي')) {
        return text.replace('[نص توضيحي — يُراجع الأصل المطبوع] ', '') + ' <span class="badge-unverified">غير مُدقّق</span>';
      }
      return text;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      buildSidebar();
      
      // Banner
      document.getElementById('dismissBanner').onclick = () => {
        document.getElementById('verificationBanner').style.display = 'none';
      };

      // Font slider
      document.getElementById('fontSlider').oninput = (e) => {
        document.documentElement.style.setProperty('--font-scale', e.target.value + 'px');
        document.getElementById('fontSizeLabel').textContent = e.target.value + 'px';
        storage.fontScale = e.target.value;
        saveStorage();
      };

      // Line height
      document.getElementById('lineHeightBtn').onclick = () => {
        if (document.body.classList.contains('line-compressed')) {
          document.body.classList.remove('line-compressed');
          document.body.classList.add('line-relaxed');
          document.getElementById('lineHeightBtn').textContent = 'مريح';
          storage.lineHeight = 'مريح';
        } else {
          document.body.classList.remove('line-relaxed');
          document.body.classList.add('line-compressed');
          document.getElementById('lineHeightBtn').textContent = 'مضغوط';
          storage.lineHeight = 'مضغوط';
        }
        saveStorage();
      };

      // Notes
      document.getElementById('notesTextarea').oninput = (e) => {
        if (storage.lastTopicId) {
          storage.notes[storage.lastTopicId] = e.target.value;
          saveStorage();
          const saved = document.getElementById('notesSaved');
          saved.classList.remove('hidden');
          setTimeout(() => saved.classList.add('hidden'), 1000);
        }
      };

      // Mobile menu
      document.getElementById('mobileMenuBtn').onclick = () => {
        document.getElementById('mobileDrawer').classList.add('open');
        document.getElementById('mobileDrawerOverlay').classList.remove('hidden');
      };
      document.getElementById('closeDrawer').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };
      document.getElementById('mobileDrawerOverlay').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };

      // Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          // Simplified tab switching
        };
      });

      // Pin
      document.getElementById('pinBtn').onclick = () => {
        document.getElementById('normalLayout').classList.toggle('hidden');
        document.getElementById('pinLayout').classList.toggle('hidden');
      };

      // Load first topic
      if (DB.topics.length > 0) {
        loadTopic(DB.topics[0].id);
      }

      // Apply saved settings
      document.documentElement.style.setProperty('--font-scale', storage.fontScale + 'px');
      document.getElementById('fontSlider').value = storage.fontScale;
      document.getElementById('fontSizeLabel').textContent = storage.fontScale + 'px';
      if (storage.lineHeight === 'مضغوط') {
        document.body.classList.add('line-compressed');
        document.getElementById('lineHeightBtn').textContent = 'مضغوط';
      } else {
        document.body.classList.add('line-relaxed');
        document.getElementById('lineHeightBtn').textContent = 'مريح';
      }
    });
  </script>
</body>
