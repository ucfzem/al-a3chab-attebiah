      line-height: var(--line-height);
      text-align: justify;
      max-width: 68ch;
    }

    .fath-text {
      font-family: 'Amiri', serif;
      font-size: calc(var(--font-scale) * 0.92);
      line-height: var(--line-height);
      text-align: justify;

      text-align: justify;
    }

      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: #e5e0d5;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #0f5132;
      border-radius: 3px;
    }

    mark {
      background-color: #fbbf24;
      color: #92400e;
      padding: 0 2px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .focus-ring:focus-visible {
      outline: 2px solid #0f5132;
      outline-offset: 2px;
    }

    .tree-node.active {
      background-color: #e8f0ec;
      color: #0f5132;
      font-weight: 600;
      position: relative;
    }

    .tree-node.active::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: #0f5132;
    }

    .drawer {
      transform: translateX(100%);
      transition: transform 150ms ease-in-out;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .tab-btn.active {
      background-color: #0f5132;
      color: white;
    }

    .fath-quote {
      border-right: 2px solid rgba(15, 81, 50, 0.3);
      padding-right: 0.75rem;
      opacity: 0.8;
    }

    .fatawa-card {
      border-right: 4px solid #b45309;
    }

    .badge-unverified {

      color: #b45309;

                "text": "شيء من أنواع السحر\nقال أحمد: حدثنا محمد بن جعفر، حدثنا عوف، عن حيان بن العلاء، حدثنا قطن\n بن قبيصة عن أبيه أنه سمع النبي صلى الله عليه وسلم قال: \"إن العيافة\n والطرق والطيرة من الجبت\" 1.\nقال عوف: العيافة: زجر الطير. والطرق: الخط يخط بالأرض.\nوالجبت: قال الحسن: \"رنة الشيطان\" إسناده جيد. ولأبي داود والنسائي وابن\n حبان في صحيحه المسند منه.\nوعن ابن عباس رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: \"من\n اقتبس شعبة من النجوم فقد اقتبس شعبة من السحر، زاد ما زاد\" 2. رواه أبو\n داود، وإسناده صحيح.\nوللنسائي من حديث أبي هريرة رضي الله عنه: \"من عقد عقدة ثم نفث فيها فقد\n سحر، ومن سحر فقد أشرك. ومن تعلق شيئا وكل إليه\" 3. PageV01P074\nوعن ابن مسعود أن رسول الله صلى الله عليه وسلم قال: \"ألا هل أنبئكم ما\n العضة؟ هي النميمة القالة بين الناس\" 1 رواه مسلم. ولهما عن ابن عمر رضي\n الله عنهما: أن رسول الله صلى الله عليه وسلم قال: \"إن من البيان لسحرا\" 2.\nفيه مسائل:\nالأولي: أن العيافة والطرق والطيرة من الجبت.\nالثانية: تفسير العيافة والطرق.\nالثالثة: أن علم ms27 النجوم من نوع السحر.\nالرابعة: العقد مع النفث من ذلك.\nالخامسة: أن النميمة من ذلك.\nالسادسة: أن من ذلك بعض الفصاحة. PageV01P075\n### | باب (25) ما جاء في الكهان ونحوهم\nروى مسلم في صحيحه عن بعض أزواج النبي صلى الله عليه وسلم عن النبي صلى\n الله عليه وسلم قال: \"من أتى عرافا فسأله عن شيء فصدقه لم تقبل له صلاة\n أربعين يوما\" 1.\nوعن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"من أتى\n كاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم\" 2.\n رواه أبو داود. وللأربعة والحاكم وقال: صحيح على شرطهما عن أبي هريرة 3\n \":من أتى عرافا أ",

                "text": "على أن الإجماع حجة؛ لأن الأمة إذا اجتمعت فقد\n دخل فيهم الطائفة المنصورة\" 1.\nفيه مسائل:\nالأولى: تفسير آية النساء.\nالثانية: تفسير آية المائدة.\nالثالثة: تفسير آية الكهف.\nالرابعة: - وهي أهمها- ما معنى الإيمان بالجبت والطاغوت، هل هو اعتقاد\n قلب، أو هو موافقة أصحابها مع بغضها ومعرفة بطلانها؟\nالخامسة: قولهم: إن الكفار الذين يعرفون كفرهم أهدى سبيلا من المؤمنين.\nالسادسة: - وهي المقصود بالترجمة- أن هذا لا بد أن يوجد في هذه الأمة،\n كما تقرر في حديث أبي سعد.\nالسابعة: التصريح بوقوعها، أعني عبادة الأوثان في هذه الأمة في جموع\n كثيرة.\nقال المصنف -رحمه الله-: \" وفيه الآية العظيمة: أنهم مع قلتهم لا يضرهم\n من خذلهم ولا من خالفهم، وفيه البشارة بأن الحق لا يزول بالكلية\". قلت:\n واحتج به الإمام أحمد على أن الاجتهاد لا ينقطع ما دامت هذه الطائفة\n موجودة.\nقوله: \" حتى يأتي أمر الله\" الظاهر أن المراد به ما روي من قبض من بقي من\n المؤمنين بالريح الطيبة; ووقوع الآيات العظام، ثم لا يبقى إلا شرار الناس،\n كما روى الحاكم أن عبد الله بن عمر قال: \" لا تقوم الساعة إلا على شرار\n الخلق، هم شر أهل الجاهلية \"2. فقال PageV01P277\nعقبة بن عامر لعبد الله: اعلم ما تقول، وأما أنا فسمعت النبي صلي الله\n عليه وسلم يقول: \" لا تزال عصابة من أمتي يقاتلون على أمر الله ظاهرين لا\n يضرهم من خالفهم حتى تأتيهم الساعة وهم على ذلك \"1. قال عبد الله: \" ويبعث\n الله ريحا ريحها المسك، ومسها مس الحرير، فلا تترك أحدا في قلبه مثقال ذرة\n من إيمان إلا قبضته; ثم يبقى شرار الناس فعليهم تقوم الساعة \".\nوفي صحيح مسلم: \" لا تقوم الساعة حتى لا يقال في الأرض الله الله \" 2.\nوعلى هذا فالمراد بقوله في حديث عقبة وما أشبهه: \"حتى تأتيهم الساعة\"\n ساعتهم. وهي وق",

                "text": "تعالى: {يعرفون نعمت الله ثم ينكرونها وأكثرهم الكافرون} \n1.\nقال مجاهد ما معناه: ms37 \"هو قول الرجل: هذا مالي ورثته عن آبائي\".\nوقال عون بن عبد الله: \"يقولون: لولا فلان لم يكن كذا\". وقال قتيبة: \"\n \"يقولون: هذا بشفاعة آلهتنا\".\nوقال أبو العباس - بعد حديث زيد بن خالد الذي فيه: \"أن الله تعالى قال:\n أصبح من عبادي مؤمن بي وكافر\" 2 - الحديث وقد تقدم -: وهذا كثير في الكتاب\n والسنة، يذم سبحانه من يضيف إنعامه إلى غيره ويشرك به.\nقال بعض السلف: هو كقولهم: كانت الريح طيبة، والملاح حاذقا، ونحو ذلك مما\n هو جار على ألسنة كثير.\nفيه مسائل:\nالأولى: تفسير معرفة النعمة وإنكارها.\nالثانية: معرفة أن هذا جار على ألسنة كثير.\nالثالثة: تسمية هذا الكلام إنكارا للنعمة.\nالرابعة: اجتماع الضدين في القلب. PageV01P108\n### | باب (41) قول الله تعالى: {فلا تجعلوا لله أندادا وأنتم تعلمون} \n1.\nقال ابن عباس في الآية: \"الأنداد: هو الشرك، أخفى من دببيب النمل على\n صفاة سوداء في ظلمة الليل\". وهو أن تقول: والله وحياتك يا فلان، وحياتي،\n وتقول: لولا كليبة هذا لأتانا اللصوص. ولولا البط في الدار لأتانا اللصوص.\n وقول الرجل لصاحبه: ما شاء الله وشئت. وقول الرجل: لولا الله وفلان. لا\n تجعل فيها فلانا ; هذا كله به شرك \" رواه ابن أبي حاتم.\nوعن عمر بن الخطاب رضي الله عنه أن رسول الله صلى الله عليه وسلم قال:\n \"من حلف بغير الله قد كفر أو أشرك\" 2 رواه الترمذي، وحسنه وصححه الحاكم.\nوقال ابن مسعود: \"لأن أحلف بالله كاذبا أحب إلي من أن أحلف بغيره صادقا\".\nوعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"لا تقولوا: ما\n شاء الله وشاء فلان، ولكن قولوا: ما شاء الله ثم شاء فلان\" 3 رواه أبو داود\n بسند صحيح. PageV01P109\nوجاء عن إبراهيم النخعي",

                "text": "ب الموجب لذلك وهو كمال الغنى.\nالرابعة: أن من الأسباب: أنه تعالى خير الشركاء.\nالخامسة: خوف النبي صلى الله عليه وسلم على أصحابه من الرياء.\nالسادسة: أنه فسر ذلك بأن يصلي المرء لله لكن يزينها لما ms281 يرى من نظر رجل\n إليه.\nالشرك الأصغر \" 4. رواه ابن أبي الدنيا في كتاب الإخلاص، وابن جرير في\n التهذيب، والطبراني والحاكم وصححه.\nقال ابن القيم: \" وأما الشرك الأصغر فكيسير الرياء والتصنع للخلق والحلف\n بغير الله، وقول الرجل للرجل: ما شاء الله وشئت، وهذا من الله ومنك، وأنا\n بالله وبك، وما لي PageV01P371\nإلا الله وأنت، وأنا متوكل على الله وعليك، ولولا الله وأنت لم يكن كذا\n وكذا. وقد يكون هذا شركا أكبر بحسب حال قائله ومقصده\". انتهى.\nولا خلاف أن الإخلاص شرط لصحة العمل وقبوله، وكذلك المتابعة، كما قال\n الفضيل بن عياض -رحمه الله- في قوله تعالى: {ليبلوكم أيكم أحسن عملا} 1.\n قال: \"أخلصه وأصوبه، قيل: يا أبا علي، ما أخلصه وأصوبه؟ قال: إن العمل إذا\n كان خالصا ولم يكن صوابا لم يقبل، وإذا كان صوابا ولم يكن خالصا لم يقبل\n حتى يكون خالصا صوابا، فالخالص ما كان لله، والصواب ما كان على السنة\".\nوفي الحديث عن الفوائد: شفقة النبي صلى الله عليه وسلم على أمته ونصحه\n لهم، وأن الرياء أخوف على الصالحين من فتنة الدجال. فإذا كان النبي صلى\n الله عليه وسلم يخافه على سادات الأولياء مع قوة إيمانهم وعلمهم، فغيرهم\n ممن هو دونهم بأضعاف أولى بالخوف من الشرك أصغره وأكبره. PageV01P372\n### | باب: \" من الشرك إرادة الإنسان بعمله الدنيا\"\nوقوله تعالى: {من كان يريد الحياة الدنيا وزينتها نوف إليهم أعمالهم فيها\n وهم فيها لا يبخسون أولئك الذين ليس لهم في الآخرة إلا النار وحبط ما صنعوا\n فيها وباطل ما كانوا يعملون} 1. PageV01P372\nالتوحي",

    // Storage
    let storage = JSON.parse(localStorage.getItem('mirqat_tawhid_v1') || '{}');
    if (!storage.fontScale) storage.fontScale = 22;
    if (!storage.lineHeight) storage.lineHeight = 'مريح';
    if (!storage.tashkeel) storage.tashkeel = false;
    if (!storage.expandedNodes) storage.expandedNodes = [];
    if (!storage.bookmarks) storage.bookmarks = [];
    if (!storage.notes) storage.notes = {};
    if (!storage.pinned) storage.pinned = [];

    // Arabic normalization
    function normalizeArabic(text) {
      return text
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي');
    }

    // Save storage
    function saveStorage() {
      localStorage.setItem('mirqat_tawhid_v1', JSON.stringify(storage));
    }

    // Build sidebar tree
    function buildSidebar() {
      const tree = document.getElementById('sidebarTree');
      const mobileTree = document.getElementById('mobileSidebarTree');
      tree.innerHTML = '';
      mobileTree.innerHTML = '';

      const rububiyya = DB.topics.filter(t => t.categories.includes('الربوبية'));
      const aluhiyya = DB.topics.filter(t => t.categories.includes('الألوهية'));

      // الربوبية
      const rubDiv = document.createElement('div');
      rubDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('rub')">▼ الربوبية</button>
        <div id="rub" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(rubDiv);
      mobileTree.appendChild(rubDiv.cloneNode(true));

      rububiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#rub').appendChild(node);
      });

      // الألوهية
      const uluDiv = document.createElement('div');
      uluDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('ulu')">▼ الألوهية</button>
        <div id="ulu" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(uluDiv);
      mobileTree.appendChild(uluDiv.cloneNode(true));

      aluhiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#ulu').appendChild(node);
      });
    }

    function toggleGroup(id) {
      const el = document.getElementById(id);
      if (el.style.display === 'none') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    // Load topic
    function loadTopic(topicId) {
      const topic = DB.topics.find(t => t.id === topicId);
      if (!topic) return;

      document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
      // Highlight active (simplified)
      const activeNodes = document.querySelectorAll('.tree-node');
      for (let n of activeNodes) {
        if (n.textContent === topic.title) {
          n.classList.add('active');
        }
      }

      // Update title
      document.getElementById('topicTitle').textContent = topic.title;
      document.getElementById('topicTitlePin').textContent = topic.title;

      // Categories
      const catDiv = document.getElementById('topicCategories');
      catDiv.innerHTML = topic.categories.map(c => `<span class="px-2 py-1 bg-accent-soft text-accent rounded text-sm">${c}</span>`).join('');

      // Matn
      const matnDiv = document.getElementById('matnContent');
      const matnDivPin = document.getElementById('matnContentPin');
      matnDiv.innerHTML = renderText(topic.kitab);
      matnDivPin.innerHTML = renderText(topic.kitab);

      // Sharh
      const sharhDiv = document.getElementById('sharhContent');
      const sharhDivPin = document.getElementById('sharhContentPin');
      sharhDiv.innerHTML = renderText(topic.fath, true);
      sharhDivPin.innerHTML = renderText(topic.fath, true);

      // Fatawa
      const fatawaDiv = document.getElementById('fatawaContent');
      const fatawaDivPin = document.getElementById('fatawaContentPin');
      fatawaDiv.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-4 bg-surface rounded-lg border border-divider">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-warn/10 text-warn px-2 py-1 rounded text-xs">مجموع الفتاوى</span>
            ${f.verificationStatus === 'placeholder' ? '<span class="badge-unverified">غير مُدقّق</span>' : ''}
          </div>
          <div class="fatawa-text">${renderPlaceholder(f.quote)}</div>
          <div class="text-xs text-muted mt-2">${f.source.book} ${f.source.volume} ص ${f.source.page} - ${f.concept}</div>
        </div>
      `).join('');
      fatawaDivPin.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-2 bg-surface rounded border border-divider mb-2">
          <div class="text-xs mb-1">${renderPlaceholder(f.quote).substring(0, 100)}...</div>
        </div>
      `).join('');

      // Notes
      document.getElementById('notesTextarea').value = storage.notes[topicId] || '';

      storage.lastTopicId = topicId;
      saveStorage();
    }

    function renderText(field, isSharh = false) {
      let text = renderPlaceholder(field.text);
      if (isSharh) {
        return `<div class="p-4">${text}</div>`;
      }
      return text;
    }

    function renderPlaceholder(text) {
      if (text.includes('[نص توضيحي')) {
        return text.replace('[نص توضيحي — يُراجع الأصل المطبوع] ', '') + ' <span class="badge-unverified">غير مُدقّق</span>';
      }
      return text;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      buildSidebar();
      
      // Banner
      document.getElementById('dismissBanner').onclick = () => {
        document.getElementById('verificationBanner').style.display = 'none';
      };

      // Font slider
      document.getElementById('fontSlider').oninput = (e) => {
        document.documentElement.style.setProperty('--font-scale', e.target.value + 'px');
        document.getElementById('fontSizeLabel').textContent = e.target.value + 'px';
        storage.fontScale = e.target.value;
        saveStorage();
      };

      // Line height
      document.getElementById('lineHeightBtn').onclick = () => {
        if (document.body.classList.contains('line-compressed')) {
          document.body.classList.remove('line-compressed');
          document.body.classList.add('line-relaxed');
          document.getElementById('lineHeightBtn').textContent = 'مريح';
          storage.lineHeight = 'مريح';
        } else {
          document.body.classList.remove('line-relaxed');
          document.body.classList.add('line-compressed');
          document.getElementById('lineHeightBtn').textContent = 'مضغوط';
          storage.lineHeight = 'مضغوط';
        }
        saveStorage();
      };

      // Notes
      document.getElementById('notesTextarea').oninput = (e) => {
        if (storage.lastTopicId) {
          storage.notes[storage.lastTopicId] = e.target.value;
          saveStorage();
          const saved = document.getElementById('notesSaved');
          saved.classList.remove('hidden');
          setTimeout(() => saved.classList.add('hidden'), 1000);
        }
      };

      // Mobile menu
      document.getElementById('mobileMenuBtn').onclick = () => {
        document.getElementById('mobileDrawer').classList.add('open');
        document.getElementById('mobileDrawerOverlay').classList.remove('hidden');
      };
      document.getElementById('closeDrawer').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };
      document.getElementById('mobileDrawerOverlay').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };

      // Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          // Simplified tab switching
        };
      });

      // Pin
      document.getElementById('pinBtn').onclick = () => {
        document.getElementById('normalLayout').classList.toggle('hidden');
        document.getElementById('pinLayout').classList.toggle('hidden');
      };

      // Load first topic
      if (DB.topics.length > 0) {
        loadTopic(DB.topics[0].id);
      }

      // Apply saved settings
      document.documentElement.style.setProperty('--font-scale', storage.fontScale + 'px');
      document.getElementById('fontSlider').value = storage.fontScale;
      document.getElementById('fontSizeLabel').textContent = storage.fontScale + 'px';
      if (storage.lineHeight === 'مضغوط') {
        document.body.classList.add('line-compressed');
        document.getElementById('lineHeightBtn').textContent = 'مضغوط';
      } else {
        document.body.classList.add('line-relaxed');
        document.getElementById('lineHeightBtn').textContent = 'مريح';
      }
    });
  </script>
